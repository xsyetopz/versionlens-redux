# cargo-deny 0.20.x. Run: cargo deny check

[graph]
# Check every feature so optional dependencies are audited too.
all-features = true

[advisories]
yanked = "deny"
# Fail on unmaintained crates only when a workspace crate depends on them directly.
unmaintained = "workspace"
unsound = "all"
ignore = []
unused-ignored-advisory = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Crates with publish = false, such as xtask, ship to no one, so their license
# does not matter.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# xtask runs cargo bedrock from the bedrock repository.
allow-git = ["https://github.com/xsyetopz/bedrock"]
