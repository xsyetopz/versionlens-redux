# Ruby, Dart, BEAM, Julia, R, Perl, OCaml, Haskell, and other language manifests; see native.toml for the row format.

[[file]]
id = 'gemfile'
globs = ['Gemfile', 'gems.rb', '*.gemspec']
format = 'text'
registry = 'rubygems'
rules = [
    { lines = '''(?m)^[ \t]*(?:gem|\w+\.add_(?:runtime_|development_)?dependency)[ \t(]+["'](?P<name>[^"']+)["'][ \t]*,[ \t]*["'](?P<version>[^"']+)["']''' },
]

# Each section's `specs:` lists a resolved gem at four spaces, `name (1.0.0)` or with a platform,
# `name (1.0.0-x86_64-linux)`; its own dependencies sit deeper. Read from
# github.com/rails/rails/blob/main/Gemfile.lock.
[[file]]
id = 'gemfile-lock'
globs = ['Gemfile.lock', 'gems.locked']
format = 'text'
registry = 'rubygems'
rules = [
    { lines = '(?m)^    (?P<name>[A-Za-z0-9][\w.-]*) \((?P<version>\d[\w.]*)(?:-[\w-]+)?\)\r?$' },
]

[[file]]
id = 'podfile'
globs = ['Podfile', '*.podspec']
format = 'text'
registry = 'cocoapods'
rules = [
    { lines = '''(?m)^[ \t]*pod[ \t]+["'](?P<name>[^"']+)["'][ \t]*,[ \t]*["'](?P<version>[^"']+)["']''' },
    { lines = '''(?m)^[ \t]*\w+\.dependency[ \t]+["'](?P<name>[^"']+)["'][ \t]*,[ \t]*["'](?P<version>[^"']+)["']''' },
]

[[file]]
id = 'pubspec'
globs = ['pubspec.yaml', 'pubspec.yml', 'pubspec_overrides.yaml']
format = 'yaml'
registry = 'pub'
rules = [
    { spec = 'version', pattern = '${OWN}', via = 'project' },
    { keys = 'dependencies' },
    { keys = 'dev_dependencies' },
    { keys = 'dependency_overrides' },
    # A workspace root lists its packages' folders: dart.dev/tools/pub/workspaces
    { spec = 'workspace.*', pattern = '^(?P<name>.+)$', via = 'directory' },
]

[[file]]
id = 'mix'
globs = ['mix.exs']
format = 'text'
registry = 'hex'
rules = [
    { lines = '\{:(?P<name>\w+),[ \t]*"(?P<version>[^"]+)"' },
]

[[file]]
id = 'rebar'
globs = ['rebar.config']
format = 'text'
registry = 'hex'
rules = [
    { lines = '\{(?P<name>\w+),[ \t]*"(?P<version>[^"]+)"\}' },
]

[[file]]
id = 'gleam'
globs = ['gleam.toml']
format = 'toml'
registry = 'hex'
rules = [
    { keys = 'dependencies' },
    { keys = 'dev-dependencies' },
]

[[file]]
id = 'julia'
globs = ['Project.toml', 'JuliaProject.toml', 'Manifest.toml', 'Manifest-v*.toml']
format = 'toml'
registry = 'julia'
rules = [
    { keys = 'compat' },
    # A manifest pins each registered package; standard libraries lack `git-tree-sha1`.
    { lines = '(?m)^\[\[(?:deps\.)?(?P<name>[\w.-]+)\]\]\r?\n(?:[^\[\n][^\n]*\n)*?git-tree-sha1[^\n]*\n(?:[^\[\n][^\n]*\n)*?version[ \t]*=[ \t]*"(?P<version>[^"]+)"' },
]

[[file]]
id = 'renv'
globs = ['renv.lock']
format = 'json'
registry = 'cran'
rules = [
    { record = 'Packages.*', name = 'Package', version = 'Version' },
]

[[file]]
id = 'r'
globs = ['DESCRIPTION']
format = 'text'
registry = 'cran'
rules = [
    { lines = '(?P<name>[A-Za-z][\w.]*)[ \t]*\((?P<version>[<>=]+[ \t]*[\d.-]+)\)' },
]

[[file]]
id = 'cpanfile'
globs = ['cpanfile']
format = 'text'
registry = 'cpan'
rules = [
    { lines = '''(?m)^[ \t]*(?:requires|recommends|suggests)[ \t]+['"](?P<name>[\w:]+)['"][ \t]*(?:,|=>)[ \t]*['"]?(?P<version>[\w.<>= ]+?)['"]?[ \t]*;''' },
]

# A CPAN distribution's metadata maps each phase's modules to a minimum version:
# metacpan.org/pod/CPAN::Meta::Spec#PREREQUISITES, read from Moose 2.2207's META.json.
[[file]]
id = 'cpan-meta'
globs = ['META.json', 'MYMETA.json']
format = 'json'
registry = 'cpan'
rules = [
    { keys = 'prereqs.*.requires' },
    { keys = 'prereqs.*.recommends' },
    { keys = 'prereqs.*.suggests' },
]

# Version 1.4 of the spec keeps the maps at the top level of META.yml:
# metacpan.org/pod/CPAN::Meta::History::Meta_1_4, read from libwww-perl 5.837's META.yml.
[[file]]
id = 'cpan-meta-yml'
globs = ['META.yml', 'MYMETA.yml']
format = 'yaml'
registry = 'cpan'
rules = [
    { keys = 'requires' },
    { keys = 'build_requires' },
    { keys = 'configure_requires' },
    { keys = 'recommends' },
]

# Dist::Zilla lists a module and its minimum version per line under `[Prereqs]` sections, with
# the phase and relationship after a ` / `; `[OSPrereqs / MSWin32]` holds one OS's:
# metacpan.org/pod/Dist::Zilla::Plugin::Prereqs, and github.com/rjbs/Dist-Zilla/blob/main/dist.ini
[[file]]
id = 'dist-ini'
globs = ['dist.ini']
format = 'ini'
registry = 'cpan'
rules = [
    { keys = 'Prereqs' },
    { keys = 'Prereqs.*' },
    { keys = 'OSPrereqs.*' },
]

[[file]]
id = 'opam'
globs = ['opam', '*.opam']
format = 'text'
registry = 'opam'
rules = [
    { lines = '"(?P<name>[\w.+-]+)"[ \t]*\{[ \t]*(?:>=|=|>)[ \t]*"(?P<version>[^"]+)"' },
]

[[file]]
id = 'dune'
globs = ['dune-project']
format = 'text'
registry = 'opam'
rules = [
    { lines = '\((?P<name>[\w-]+)[ \t]+\((?P<version>(?:>=|=)[ \t]*[\w.~+-]+)\)' },
]

[[file]]
id = 'cabal'
globs = ['*.cabal', 'cabal.project', 'stack.yaml', 'stack.yml']
format = 'text'
registry = 'hackage'
rules = [
    { lines = '(?m)(?:build-depends:|constraints:|,|^)[ \t]*(?P<name>[A-Za-z][\w-]*)[ \t]+(?P<version>(?:\^>=|>=|==)[ \t]*\d[\d.]*)' },
    { lines = '(?m)^[ \t]*with-compiler:[ \t]*(?P<name>ghc)-(?P<version>\d[\d.]*)', via = 'ghc' },
    # Stack's `extra-deps` entries read `- package-1.2.3`.
    { lines = '(?m)^[ \t]*-[ \t]+(?P<name>[A-Za-z][\w-]*?)-(?P<version>\d+(?:\.\d+)*)(?:@\S+)?[ \t]*(?:#.*)?\r?$' },
]

[[file]]
id = 'rockspec'
globs = ['*.rockspec']
format = 'text'
registry = 'luarocks'
rules = [
    { lines = '''["'](?P<name>[A-Za-z][\w.-]*)[ \t]*(?P<version>(?:>=|<=|==|~>|>|<|~=)[ \t]*\d[\w.-]*)["']''' },
]

[[file]]
id = 'flake'
globs = ['flake.nix']
format = 'text'
registry = 'github'
rules = [
    # Nixpkgs pins release branches, `github:NixOS/nixpkgs/nixos-24.05`, named for its tags.
    { lines = 'github:(?P<name>[\w.-]+/[\w.-]+)/(?:nixos-|nixpkgs-|release-)?(?P<version>v?\d[\w.-]*)' },
    { lines = 'github:(?P<name>[\w.-]+/[\w.-]+)\?ref=(?:refs/tags/)?(?P<version>v?\d[\w.-]*)' },
]


# Typst imports a Universe package at its full version, `#import "@preview/{name}:{version}"`:
# github.com/typst/packages, README.md.
[[file]]
id = 'typst'
globs = ['*.typ']
format = 'text'
registry = 'typst'
rules = [
    { lines = '"@preview/(?P<name>[a-z][\w-]*):(?P<version>\d[\w.-]*)"' },
]

# Wally maps an alias to `"scope/name@version"` under [dependencies], [server-dependencies], and
# [dev-dependencies]: github.com/UpliftGames/wally, README.md.
[[file]]
id = 'wally'
globs = ['wally.toml']
format = 'text'
registry = 'wally'
rules = [
    { lines = '''(?m)^[ \t]*[\w-]+[ \t]*=[ \t]*["'](?P<name>[a-z0-9_-]+/[a-z0-9_-]+)@(?P<version>[^"']+)["']''' },
]

# MoonBit's moon.mod.json maps `deps` to a version or a local `path`: docs.moonbitlang.com,
# toolchain/moon/module.md.
[[file]]
id = 'moonbit'
globs = ['moon.mod.json']
format = 'json'
registry = 'mooncakes'
rules = [{ keys = 'deps' }]

# Spago lists a package-set dependency by name and a registry one with its range,
# `- lists: ">=7.0.0 <8.0.0"`: github.com/purescript/spago, README.md.
[[file]]
id = 'spago'
globs = ['spago.yaml']
format = 'text'
registry = 'purescript'
rules = [
    { lines = '''(?m)^[ \t]*-[ \t]+(?P<name>[a-z][\w-]*):[ \t]*["']?(?P<version>[<>=]*[ \t]*\d[^"'\r\n#]*?)["']?[ \t]*(?:#.*)?\r?$''' },
]

# Corral, the Pony package manager, lists `deps` as a `locator` and a `version`:
# github.com/ponylang/http_server's corral.json.
[[file]]
id = 'corral'
globs = ['corral.json']
format = 'text'
registry = 'github'
rules = [
    { lines = '"locator"\s*:\s*"github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"\s*,\s*"version"\s*:\s*"(?P<version>[^"]+)"' },
]

# Qlot's qlfile takes a GitHub library at a `:tag`, by `github owner/repo` or a `git` URL:
# github.com/fukamachi/qlot, README.markdown. A Quicklisp dist date is not read.
[[file]]
id = 'qlfile'
globs = ['qlfile']
format = 'text'
registry = 'github'
rules = [
    { lines = '(?m)^[ \t]*github[ \t]+(?P<name>[\w.-]+/[\w.-]+)[ \t]+:tag[ \t]+(?P<version>\S+)' },
    { lines = '(?m)^[ \t]*git[ \t]+\S+[ \t]+https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?[ \t]+:tag[ \t]+(?P<version>\S+)' },
]

# Lake requires a git package at a `rev`, in lakefile.toml as `git` then `rev` and in lakefile.lean
# as `from git "url" @ "rev"`: leanprover/lean4, src/lake/README.md. Only a release-like rev reads,
# not a branch or commit; a Reservoir `scope`/`version` is not read.
[[file]]
id = 'lake'
globs = ['lakefile.toml', 'lakefile.lean']
format = 'text'
registry = 'github'
rules = [
    { lines = '''git[ \t]*=[ \t]*"https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"[ \t]*\r?\n(?:[ \t]*\w+[ \t]*=.*\r?\n)*?[ \t]*rev[ \t]*=[ \t]*"(?P<version>v?\d+\.\d[\w.-]*)"''' },
    { lines = 'from\s+git\s+"https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"\s*@\s*"(?P<version>v?\d+\.\d[\w.-]*)"' },
]
