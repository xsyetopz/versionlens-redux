# Runtime-version files, tool managers, and repository tooling configuration; see native.toml
# for the row format.
#
# Tool managers name runtimes by registry id (`python`, `ruby`, `rust`, `golang`) or through
# registry::alias (`terraform`). The nested `registry` and `name` groups capture one word twice,
# so the dependency is looked up where that word says and keeps it as its name.

[[file]]
id = 'tool-versions'
globs = ['.tool-versions']
format = 'text'
registry = 'npm'
rules = [
    { lines = '(?m)^[ \t]*(?P<name>node|bun|pnpm)(?:js)?[ \t]+(?P<version>\d[\w.]*)' },
    { lines = '(?m)^[ \t]*(?P<registry>(?P<name>python|ruby|rust|terraform|golang))[ \t]+(?P<version>\d[\w.]*)' },
]

[[file]]
id = 'mise'
globs = ['mise.toml', '.mise.toml', 'mise.*.toml', '.mise.*.toml', '.mise/config.toml', '.config/mise/config.toml']
format = 'text'
registry = 'npm'
rules = [
    { lines = '''(?m)^[ \t]*["']?(?P<name>node|bun|pnpm|npm)["']?[ \t]*=[ \t]*(?:\{[^}\n]*?[ {,]version[ \t]*=[ \t]*)?["'](?P<version>\d[\w.]*)["']''' },
    { lines = '''(?m)^[ \t]*["']?(?P<registry>(?P<name>python|ruby|rust|terraform|golang))["']?[ \t]*=[ \t]*(?:\{[^}\n]*?[ {,]version[ \t]*=[ \t]*)?["'](?P<version>\d[\w.]*)["']''' },
    { lines = '''(?m)^[ \t]*["'](?P<registry>npm|cargo|pipx|go):(?P<name>[^"'\s]+)["'][ \t]*=[ \t]*(?:\{[^}\n]*?[ {,]version[ \t]*=[ \t]*)?["'](?P<version>\d[\w.]*)["']''' },
]

[[file]]
id = 'ruby'
globs = ['.ruby-version']
format = 'text'
registry = 'ruby'
rules = [
    { lines = '\A\s*(?:ruby-)?(?P<version>\d[\w.]*)\s*\z' },
]

[[file]]
id = 'terraform-cli'
globs = ['.terraform-version']
format = 'text'
registry = 'terraform-cli'
rules = [
    { lines = '${TOOL_VERSION}' },
]

[[file]]
id = 'pre-commit'
globs = ['.pre-commit-config.yaml', '.pre-commit-config.yml']
format = 'yaml'
registry = 'github'
rules = [
    { lines = '''(?m)repo:[ \t]*["']?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?["']?[ \t]*\r?\n[ \t]*rev:[ \t]*["']?(?P<version>v?\d[\w.-]*)''' },
]

[[file]]
id = 'devcontainer'
globs = ['devcontainer.json']
format = 'json'
registry = 'docker'
rules = [
    { spec = 'image', pattern = '${DOCKER}' },
]

