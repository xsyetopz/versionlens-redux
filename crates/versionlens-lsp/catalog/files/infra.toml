# Containers, CI, orchestration, and infrastructure files; see native.toml for the row format.

[[file]]
id = 'dockerfile'
globs = ['Dockerfile', 'dockerfile', '*.Dockerfile', '*.dockerfile', 'Dockerfile.*', 'Containerfile', 'Earthfile']
format = 'text'
registry = 'docker'
rules = [
    { lines = '(?mi)^[ \t]*FROM[ \t]+(?:--\S+[ \t]+)*(?P<name>[\w./-]+(?::\d+/[\w./-]+)?):(?P<version>[\w.-]+)' },
]

[[file]]
id = 'compose'
globs = ['compose.yaml', 'compose.yml', 'compose.*.yaml', 'compose.*.yml', 'docker-compose*.yaml', 'docker-compose*.yml', '*.compose.yaml', '*.compose.yml']
format = 'yaml'
registry = 'docker'
rules = [
    { spec = 'services.*.image', pattern = '${DOCKER}' },
]

[[file]]
id = 'kustomize'
globs = ['kustomization.yaml', 'kustomization.yml', 'Kustomization']
format = 'yaml'
registry = 'docker'
rules = [
    { record = 'images.*', name = 'name', version = 'newTag' },
]

[[file]]
id = 'github-actions'
globs = ['.github/workflows/**/*.yml', '.github/workflows/**/*.yaml', '.github/actions/**/*.yml', '.github/actions/**/*.yaml', 'action.yml', 'action.yaml']
format = 'yaml'
registry = 'github'
rules = [
    { spec = 'jobs.*.steps.*.uses', pattern = '${ACTION}' },
    { spec = 'jobs.*.uses', pattern = '${ACTION}' },
    { spec = 'runs.steps.*.uses', pattern = '${ACTION}' },
    { lines = '${IMAGE_LINE}', via = 'docker' },
    { lines = '''(?m)uses:[ \t]*["']?docker://(?P<name>[\w./-]+(?::\d+/[\w./-]+)?):(?P<version>[\w.-]+)''', via = 'docker' },
    # The runtime a setup action installs, from its `<tool>-version` input, as the fork's master
    # read it: github.com/actions/setup-node, setup-python, setup-go, ruby/setup-ruby, and
    # oven-sh/setup-bun. Expressions such as `${{ matrix.node }}` and lists stay out.
    { lines = '''(?m)^[ \t]+(?P<name>node|bun)-version:[ \t]*["']?(?P<version>\d[\w.]*)["']?[ \t]*(?:#.*)?\r?$''', via = 'npm' },
    { lines = '''(?m)^[ \t]+(?P<registry>(?P<name>python|ruby))-version:[ \t]*["']?(?P<version>\d[\w.]*)["']?[ \t]*(?:#.*)?\r?$''' },
    { lines = '''(?m)^[ \t]+(?P<name>go)-version:[ \t]*["']?(?P<version>\d[\w.]*)["']?[ \t]*(?:#.*)?\r?$''', via = 'golang' },
]

# CI services and dev environments that name images under `image:` keys at any depth.
[[file]]
id = 'ci-images'
globs = ['bitbucket-pipelines.yml', '.drone.yml', '.woodpecker.yml', '.woodpecker.yaml', '.woodpecker/*.yml', '.woodpecker/*.yaml', '.gitpod.yml', '.cirrus.yml', 'azure-pipelines.yml', 'azure-pipelines.yaml', 'cloudbuild.yaml', 'cloudbuild.yml']
format = 'text'
registry = 'docker'
rules = [
    { lines = '${IMAGE_LINE}' },
]

# Kubernetes manifests have no fixed name; these are the folders and suffixes that hold them,
# with Flux's `clusters/` (fluxcd.io/flux/guides/repository-structure/) and Argo CD's own folders.
[[file]]
id = 'kubernetes'
globs = ['k8s/**/*.yaml', 'k8s/**/*.yml', 'kubernetes/**/*.yaml', 'kubernetes/**/*.yml', 'manifests/**/*.yaml', 'manifests/**/*.yml', 'deploy/**/*.yaml', 'deploy/**/*.yml', 'clusters/**/*.yaml', 'clusters/**/*.yml', 'argocd/**/*.yaml', 'argocd/**/*.yml', 'argo-cd/**/*.yaml', 'argo-cd/**/*.yml', '*.k8s.yaml', '*.k8s.yml', 'skaffold.yaml', 'tilt.yaml']
format = 'text'
registry = 'docker'
rules = [
    { lines = '${IMAGE_LINE}' },
    # An Argo CD Application's Helm source names `chart`, `repoURL`, and `targetRevision`, in
    # the docs' order or with `repoURL` first; git sources have no `chart`:
    # github.com/argoproj/argo-cd/blob/master/docs/operator-manual/declarative-setup.md
    { lines = '''(?m)^[ \t]*(?:-[ \t]+)?chart:[ \t]*["']?(?P<name>[\w.-]+)["']?[ \t]*\r?\n(?:[ \t]+[^\n]*\n)*?[ \t]+repoURL:[ \t]*["']?(?P<source>https?://[^"'\s]+)["']?[ \t]*\r?\n(?:[ \t]+[^\n]*\n)*?[ \t]+targetRevision:[ \t]*["']?(?P<version>v?\d[^"'\s]*)''', via = 'helm' },
    { lines = '''(?m)^[ \t]*(?:-[ \t]+)?repoURL:[ \t]*["']?(?P<source>https?://[^"'\s]+)["']?[ \t]*\r?\n(?:[ \t]+[^\n]*\n)*?[ \t]+chart:[ \t]*["']?(?P<name>[\w.-]+)["']?[ \t]*\r?\n(?:[ \t]+[^\n]*\n)*?[ \t]+targetRevision:[ \t]*["']?(?P<version>v?\d[^"'\s]*)''', via = 'helm' },
    # Flux sources pin an OCI artifact or a git repository by `ref.tag`:
    # github.com/fluxcd/source-controller/blob/main/docs/spec/v1/ocirepositories.md and
    # gitrepositories.md
    { lines = '''(?m)^[ \t]+url:[ \t]*["']?oci://(?P<name>[\w.-]+(?::\d+)?/[\w./-]+)["']?[ \t]*\r?\n(?:[ \t]+[^\n]*\n)*?[ \t]+tag:[ \t]*["']?(?P<version>v?\d[^"'\s]*)''', via = 'oci' },
    { lines = '''(?m)^[ \t]+url:[ \t]*["']?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?["']?[ \t]*\r?\n(?:[ \t]+[^\n]*\n)*?[ \t]+tag:[ \t]*["']?(?P<version>v?\d[^"'\s]*)''', via = 'github' },
]

# Helm chart values split an image into `repository` and `tag`, at the top or under a component.
[[file]]
id = 'helm-values'
globs = ['values.yaml', 'values.yml', 'values-*.yaml', 'values.*.yaml']
format = 'yaml'
registry = 'docker'
rules = [
    { lines = '${IMAGE_LINE}' },
    { record = 'image', name = 'repository', version = 'tag' },
    { record = '*.image', name = 'repository', version = 'tag' },
]

[[file]]
id = 'puppetfile'
globs = ['Puppetfile']
format = 'text'
registry = 'puppet'
rules = [
    { lines = '''(?m)^[ \t]*mod[ \t]+["'](?P<group>[A-Za-z0-9]+)[-/](?P<name>[a-z][a-z0-9_]*)["'][ \t]*,[ \t]*["'](?P<version>\d[^"']*)["']''' },
]

[[file]]
id = 'chef'
globs = ['Berksfile', 'metadata.rb']
format = 'text'
registry = 'chef'
rules = [
    { lines = '''(?m)^[ \t]*(?:cookbook|depends)[ \t]+["'](?P<name>[\w.-]+)["'][ \t]*,[ \t]*["'](?P<version>[^"']+)["']''' },
]

[[file]]
id = 'helm'
globs = ['Chart.yaml']
format = 'yaml'
registry = 'helm'
rules = [
    { record = 'dependencies.*', name = 'name', version = 'version', source = 'repository' },
]

[[file]]
id = 'ansible'
globs = ['requirements.yml', 'requirements.yaml', 'galaxy.yml']
format = 'yaml'
registry = 'galaxy'
rules = [
    { record = 'collections.*', name = 'name', version = 'version' },
    { keys = 'dependencies' },
]

[[file]]
id = 'terraform'
globs = ['*.tf', '*.tofu']
format = 'text'
registry = 'terraform'
rules = [
    { lines = 'source[ \t]*=[ \t]*"(?P<name>[\w-]+/[\w-]+(?:/[\w-]+)?)"\s*version[ \t]*=[ \t]*"(?P<version>[^"]+)"' },
    { lines = 'version[ \t]*=[ \t]*"(?P<version>[^"]+)"\s*source[ \t]*=[ \t]*"(?P<name>[\w-]+/[\w-]+(?:/[\w-]+)?)"' },
    { lines = '${GITHUB_REF}', via = 'github' },
]

# A unit's `terraform { source }` names a registry module as `tfr://[host]/ns/name/provider`
# with `?version=`, or a git module pinned by `?ref=`:
# docs.terragrunt.com/reference/hcl/blocks/terraform/
[[file]]
id = 'terragrunt'
globs = ['terragrunt.hcl', 'terragrunt.stack.hcl']
format = 'text'
registry = 'terraform'
rules = [
    { lines = 'tfr://(?:registry\.(?:terraform\.io|opentofu\.org))?/(?P<name>[\w-]+/[\w-]+/[\w-]+)(?://[^?"\s]*)?\?version=(?P<version>[^"&\s]+)' },
    { lines = '${GITHUB_REF}', via = 'github' },
]

# Packer plugins are GitHub repositories named `packer-plugin-<name>`, which `required_plugins`
# gives as `github.com/<owner>/<name>`:
# developer.hashicorp.com/packer/docs/templates/hcl_templates/blocks/packer
[[file]]
id = 'packer'
globs = ['*.pkr.hcl']
format = 'text'
registry = 'packer'
rules = [
    { lines = 'version[ \t]*=[ \t]*"(?P<version>[^"]+)"\s*source[ \t]*=[ \t]*"github\.com/(?P<name>[\w.-]+/[\w-]+)"' },
    { lines = 'source[ \t]*=[ \t]*"github\.com/(?P<name>[\w.-]+/[\w-]+)"\s*version[ \t]*=[ \t]*"(?P<version>[^"]+)"' },
]

# A release names its chart `repository/chart` after a `repositories` entry, which Artifact Hub
# names the same way for the public repositories; `version` comes before or after it. Local
# charts start with `.` and stay out: helmfile.readthedocs.io (docs/index.md, Configuration).
[[file]]
id = 'helmfile'
globs = ['helmfile.yaml', 'helmfile.yml', 'helmfile.yaml.gotmpl', 'helmfile.d/*.yaml', 'helmfile.d/*.yaml.gotmpl']
format = 'text'
registry = 'artifacthub'
rules = [
    { lines = '''(?m)^[ \t]*(?:-[ \t]+)?chart:[ \t]*["']?(?P<name>\w[\w.-]*/[\w.-]+)["']?[ \t]*\r?\n(?:[ \t]+[^\s-][^\n]*\r?\n)*?[ \t]+version:[ \t]*["']?(?P<version>[^"'\s#]+)''' },
    { lines = '''(?m)^[ \t]*(?:-[ \t]+)?version:[ \t]*["']?(?P<version>[^"'\s#]+)["']?[ \t]*\r?\n(?:[ \t]+[^\s-][^\n]*\r?\n)*?[ \t]+chart:[ \t]*["']?(?P<name>\w[\w.-]*/[\w.-]+)["']?[ \t]*\r?$''' },
]

# Vagrant Cloud boxes: `config.vm.box` with an optional `config.vm.box_version` constraint:
# developer.hashicorp.com/vagrant/docs/vagrantfile/machine_settings
[[file]]
id = 'vagrant'
globs = ['Vagrantfile']
format = 'text'
registry = 'vagrant'
rules = [
    { lines = '''\.vm\.box[ \t]*=[ \t]*["'](?P<name>[\w.-]+/[\w.-]+)["'][^\n]*\r?\n(?:[^\n]*\n)*?[ \t]*\w+\.vm\.box_version[ \t]*=[ \t]*["'](?P<version>[^"']+)["']''' },
]

# A part builds from `source` at a `source-tag`, one of the git refs craft-parts accepts; a
# line ending in `:` opens another part or block, which ends the search:
# github.com/canonical/craft-parts/blob/main/craft_parts/sources/git_source.py
[[file]]
id = 'snapcraft'
globs = ['snapcraft.yaml', '.snapcraft.yaml']
format = 'text'
registry = 'github'
rules = [
    { lines = '''(?m)^[ \t]+source:[ \t]*["']?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?["']?[ \t]*\r?\n(?:[ \t]+[^\n]*[^:\s][ \t]*\r?\n){0,8}?[ \t]+source-tag:[ \t]*["']?(?P<version>v?\d[^"'\s]*)''' },
    { lines = '''(?m)^[ \t]+source-tag:[ \t]*["']?(?P<version>v?\d[^"'\s]*)["']?[ \t]*\r?\n(?:[ \t]+[^\n]*[^:\s][ \t]*\r?\n){0,8}?[ \t]+source:[ \t]*["']?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?["']?[ \t]*\r?$''' },
]

# Flatpak manifests are named for their reverse-DNS app id and hold `app-id` (or `id`) and
# `runtime-version`; a git source gives `url` and `tag`, as Flathub's
# github.com/flathub/com.github.tchx84.Flatseal/blob/master/com.github.tchx84.Flatseal.json does.
[[file]]
id = 'flatpak'
globs = ['com.*.json', 'org.*.json', 'io.*.json', 'net.*.json', 'dev.*.json', 'app.*.json']
content = ['app-id', 'runtime-version']
format = 'json'
registry = 'github'
rules = [
    { lines = '"url":[ \t]*"https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"[ \t]*,\s*(?:"[\w-]+":[ \t]*"[^"\n]*"[ \t]*,\s*)*?"tag":[ \t]*"(?P<version>v?\d[^"]*)"' },
    { lines = '"tag":[ \t]*"(?P<version>v?\d[^"]*)"[ \t]*,\s*(?:"[\w-]+":[ \t]*"[^"\n]*"[ \t]*,\s*)*?"url":[ \t]*"https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"' },
]

[[file]]
id = 'flatpak'
globs = ['com.*.yaml', 'org.*.yaml', 'io.*.yaml', 'net.*.yaml', 'dev.*.yaml', 'app.*.yaml', 'com.*.yml', 'org.*.yml', 'io.*.yml', 'net.*.yml', 'dev.*.yml', 'app.*.yml']
content = ['app-id', 'runtime-version']
format = 'yaml'
registry = 'github'
rules = [
    { lines = '''(?m)^[ \t]+(?:-[ \t]+)?url:[ \t]*["']?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?["']?[ \t]*\r?\n(?:[ \t]+[^\s-][^\n]*\n)*?[ \t]+tag:[ \t]*["']?(?P<version>v?\d[^"'\s]*)''' },
]

[[file]]
id = 'terraform-lock'
globs = ['.terraform.lock.hcl']
format = 'text'
registry = 'terraform'
rules = [
    { lines = 'provider[ \t]+"registry\.terraform\.io/(?P<name>[\w-]+/[\w-]+)"[ \t]*\{\s*version[ \t]*=[ \t]*"(?P<version>[^"]+)"' },
]

[[file]]
id = 'gitlab-ci'
globs = ['.gitlab-ci.yml', '.gitlab-ci.yaml']
format = 'yaml'
registry = 'docker'
rules = [
    { spec = 'image', pattern = '${DOCKER}' },
    { spec = 'image.name', pattern = '${DOCKER}' },
    { spec = 'services.*', pattern = '${DOCKER}' },
    { spec = 'services.*.name', pattern = '${DOCKER}' },
    { spec = '*.image', pattern = '${DOCKER}' },
    { spec = '*.image.name', pattern = '${DOCKER}' },
    { spec = '*.services.*', pattern = '${DOCKER}' },
    { spec = '*.services.*.name', pattern = '${DOCKER}' },
]

[[file]]
id = 'circleci'
globs = ['.circleci/config.yml', '.circleci/config.yaml']
format = 'yaml'
registry = 'docker'
rules = [
    { spec = 'jobs.*.docker.*.image', pattern = '${DOCKER}' },
    { spec = 'executors.*.docker.*.image', pattern = '${DOCKER}' },
]

