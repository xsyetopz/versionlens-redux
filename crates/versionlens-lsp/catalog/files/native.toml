# Systems and native toolchains.
#
# Each [[file]] row is one kind of manifest: `globs` matched against the end of a path,
# case-insensitively, the `format` that reads it (json, toml, yaml, xml, or text), the `registry`
# that answers for its dependencies, an optional `insert` written before a version added to a
# bare name, and `rules`: { keys }, { spec, pattern }, { record, name, version, source? }, or
# { lines }, each with an optional `via` registry, or { use } for a list in shared.toml.
# Patterns may name a shared pattern as ${NAME}. A glob two rows share belongs to the earlier
# row, and the groups load in the order of GROUPS in src/catalog.rs.

[[file]]
id = 'cargo'
globs = ['Cargo.toml']
format = 'toml'
registry = 'cargo'
rules = [
    { keys = 'dependencies' },
    { keys = 'dev-dependencies' },
    { keys = 'build-dependencies' },
    { keys = 'target.*.dependencies' },
    { keys = 'target.*.dev-dependencies' },
    { keys = 'target.*.build-dependencies' },
    { keys = 'workspace.dependencies' },
]

[[file]]
id = 'go'
globs = ['go.mod', 'go.work']
format = 'text'
registry = 'go'
rules = [
    { lines = '(?m)^(?:require[ \t]+|[ \t]+)(?P<name>[\w.~-]+\.[\w.~/-]+)[ \t]+(?P<version>v\d[^\s]*)' },
    # The `go` and `toolchain` directives pin the Go release itself.
    { lines = '(?m)^(?:go[ \t]+|toolchain[ \t]+go)(?P<version>\d[\w.]*)[ \t]*\r?$', via = 'golang' },
]

# dep and Glide, the Go package managers before modules.
[[file]]
id = 'gopkg'
globs = ['Gopkg.toml']
format = 'toml'
registry = 'go'
rules = [
    { record = 'constraint.*', name = 'name', version = 'version' },
    { record = 'override.*', name = 'name', version = 'version' },
]

[[file]]
id = 'glide'
globs = ['glide.yaml', 'glide.yml']
format = 'yaml'
registry = 'go'
rules = [
    { record = 'import.*', name = 'package', version = 'version' },
    { record = 'testImport.*', name = 'package', version = 'version' },
]

[[file]]
id = 'bazel'
globs = ['MODULE.bazel']
format = 'text'
registry = 'bazel'
rules = [
    { lines = 'bazel_dep\(\s*name\s*=\s*"(?P<name>[^"]+)"\s*,\s*version\s*=\s*"(?P<version>[^"]+)"' },
]

[[file]]
id = 'vcpkg'
globs = ['vcpkg.json']
format = 'json'
registry = 'vcpkg'
rules = [
    { record = 'dependencies.*', name = 'name', version = 'version>=' },
    { record = 'overrides.*', name = 'name', version = 'version|version-semver|version-string|version-date' },
]

[[file]]
id = 'conan'
globs = ['conanfile.txt', 'conanfile.py']
format = 'text'
registry = 'conan'
rules = [
    { lines = '''(?m)(?:^[ \t]*|requires\(\s*["']|["'])(?P<name>[a-z0-9][\w.+-]*)/(?P<version>\d[\w.+-]*)''' },
]

[[file]]
id = 'shards'
globs = ['shard.yml']
format = 'yaml'
registry = 'github'
rules = [
    { record = 'dependencies.*', name = 'github', version = 'version' },
    { record = 'development_dependencies.*', name = 'github', version = 'version' },
]

[[file]]
id = 'mint'
globs = ['Mintfile']
format = 'text'
registry = 'github'
rules = [
    { lines = '(?m)^[ \t]*(?:https://github\.com/)?(?P<name>[\w.-]+/[\w.-]+?)(?:\.git)?@(?P<version>v?\d[\w.-]*)' },
]

[[file]]
id = 'carthage'
globs = ['Cartfile', 'Cartfile.private']
format = 'text'
registry = 'github'
rules = [
    { lines = '(?m)^[ \t]*github[ \t]+"(?P<name>[\w.-]+/[\w.-]+)"[ \t]+"?(?P<version>(?:~>|>=|==)?[ \t]*v?\d[\w.-]*)' },
]

[[file]]
id = 'swift'
globs = ['Package.swift']
format = 'text'
registry = 'swift'
rules = [
    { lines = '\.package\(\s*url:\s*"https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"\s*,\s*(?:from:|exact:|\.upToNextMajor\(from:|\.upToNextMinor\(from:)\s*"(?P<version>[^"]+)"' },
]

[[file]]
id = 'cmake'
globs = ['CMakeLists.txt', '*.cmake']
format = 'text'
registry = 'github'
rules = [
    { lines = 'gh:(?P<name>[\w.-]+/[\w.-]+)#(?P<version>v?\d[\w.-]*)' },
    { lines = 'GIT_REPOSITORY\s+https://github\.com/(?P<name>[\w.-]+/[\w-]+)(?:\.git)?\s+GIT_TAG\s+(?P<version>v?\d[\w.-]*)' },
]

[[file]]
id = 'cargo-config'
globs = ['.cargo/config.toml', '.cargo/config']
format = 'toml'
registry = 'cargo'
rules = [
    { keys = 'patch.*' },
]

[[file]]
id = 'rust'
globs = ['rust-toolchain', 'rust-toolchain.toml']
format = 'text'
registry = 'rust'
rules = [
    { lines = '''(?m)^[ \t]*(?:channel[ \t]*=[ \t]*["'])?(?P<version>\d+\.\d+(?:\.\d+)?)["']?[ \t]*(?:#.*)?\r?$''' },
]

[[file]]
id = 'golang'
globs = ['.go-version']
format = 'text'
registry = 'golang'
rules = [
    { lines = '\A\s*(?:go)?(?P<version>\d[\w.]*)\s*\z' },
]

[[file]]
id = 'zig'
globs = ['build.zig.zon']
format = 'text'
registry = 'github'
rules = [
    { lines = '${GITHUB_ARCHIVE}' },
    { lines = '${GITHUB_RELEASE}' },
    { lines = '${GITHUB_FRAGMENT}' },
]

[[file]]
id = 'nimble'
globs = ['*.nimble']
format = 'text'
registry = 'github'
rules = [
    { lines = 'requires[ \t(]+"https?://github\.com/(?P<name>[\w.-]+/[\w-]+)(?:\.git)?[ \t]+(?P<version>(?:>=|<=|==|\^=|~=|>|<)[ \t]*v?\d[\w.-]*)"' },
]

[[file]]
id = 'xmake'
globs = ['xmake.lua']
format = 'text'
registry = 'xmake'
rules = [
    { lines = '''add_requires\([^)\n]*?["'](?P<name>[A-Za-z][\w.+-]*)[ \t]+(?P<version>\d[\w.*]*)["']''' },
]

[[file]]
id = 'meson-wrap'
globs = ['subprojects/*.wrap']
format = 'text'
registry = 'github'
rules = [
    { lines = '(?m)^[ \t]*url[ \t]*=[ \t]*https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?[ \t]*\r?\n(?:[^\n]*\n)*?[ \t]*revision[ \t]*=[ \t]*(?P<version>v?\d[\w.-]*)' },
    { lines = '${GITHUB_ARCHIVE}' },
    { lines = '${GITHUB_RELEASE}' },
]

[[file]]
id = 'bazel-workspace'
globs = ['WORKSPACE', 'WORKSPACE.bazel']
format = 'text'
registry = 'github'
rules = [
    { lines = '${GITHUB_ARCHIVE}' },
    { lines = '${GITHUB_RELEASE}' },
]

