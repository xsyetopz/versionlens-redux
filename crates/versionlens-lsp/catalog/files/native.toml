# Systems and native toolchains.
#
# Each [[file]] row is one kind of manifest: `globs` matched against the end of a path,
# case-insensitively, with optional `exclude` globs that rule a path out and `content`, top-level
# keys of which the document must hold one (such a row matches only after every row that
# matches by name has failed), the `format` that reads it (json, toml, yaml, xml, ini, or
# text), the `registry` that answers for its dependencies, an optional `insert` written before a
# version added to a bare name, `pinned = true` where each version is the exact one installed, as
# in a lockfile, `precise = true` where an update writes the whole version rather than the
# requirement's own precision, and `rules`: { keys }, { spec, pattern }, { record, name, version,
# source? }, or { lines }, each with an optional `via` registry, `prefix` and `suffix` that names start and
# end with, and `within` regex that limits a text rule to what it matches, or to its first group (all
# of it where it captures a `suffix`, which then ends each name), or { use } for a list
# in shared.toml. A dotted path's `*` segment matches any key or list index, and `#` only a
# list index.
# Patterns may name a shared pattern as ${NAME}. A glob two rows share belongs to the earlier
# row, and the groups load in the order of GROUPS in src/catalog.rs.

[[file]]
id = 'cargo'
globs = ['Cargo.toml']
format = 'toml'
registry = 'cargo'
rules = [
    { spec = 'package.version', pattern = '${OWN}', via = 'project' },
    # The oldest Rust release the package supports, which the fork's master looked up as a toolchain:
    # doc.rust-lang.org/cargo/reference/rust-version.html
    { lines = '''(?m)^[ \t]*(?P<name>rust)-version[ \t]*=[ \t]*["'](?P<version>\d+\.\d+(?:\.\d+)?)["']''', via = 'rust' },
    { keys = 'dependencies' },
    { keys = 'dev-dependencies' },
    { keys = 'build-dependencies' },
    { keys = 'target.*.dependencies' },
    { keys = 'target.*.dev-dependencies' },
    { keys = 'target.*.build-dependencies' },
    { keys = 'workspace.dependencies' },
    # `[patch.<registry>]` overrides a crate, mostly with git or a path, as the fork's master read
    # it: doc.rust-lang.org/cargo/reference/overriding-dependencies.html#the-patch-section
    { keys = 'patch.*' },
    # A member's `foo = { workspace = true }` or `foo.workspace = true` takes the version the
    # workspace root's `[workspace.dependencies]` gives, which the root's own lens shows, as the
    # fork's master named it `workspace:true`:
    # doc.rust-lang.org/cargo/reference/specifying-dependencies.html#inheriting-a-dependency-from-a-workspace
    { lines = '''(?m)^[ \t]*(?P<name>[A-Za-z0-9_-]+)(?:\.|[ \t]*=[ \t]*\{[^}\n]*?(?-u:\b))(?P<source>workspace)[ \t]*=[ \t]*true''', within = '''(?m)^[ \t]*\[(?:[^\]\n]*\.)?(?:dev-|build-)?dependencies\][^\n]*(?P<body>(?:\r?\n(?:[ \t]*[^\[\s][^\n]*|[ \t]*))*)''', via = 'source' },
]

# Resolved crates. Read from this repository's own Cargo.lock, whose crates.io entries name the
# git index, and the sparse index source: doc.rust-lang.org/cargo/reference/registry-index.html
# #sparse-protocol. A git package's `source` is its repository and commit,
# `git+https://github.com/zed-industries/alacritty?rev=…#…` in zed-industries/zed's Cargo.lock,
# and reads as that source; a path package has no `source` and names no directory, so it stays out.
[[file]]
id = 'cargo-lock'
globs = ['Cargo.lock']
format = 'text'
registry = 'cargo'
pinned = true
rules = [
    { lines = '(?m)^name = "(?P<name>[^"]+)"\r?\nversion = "(?P<version>[^"]+)"\r?\nsource = "(?:registry\+https://github\.com/rust-lang/crates\.io-index|sparse\+https://index\.crates\.io/)"' },
    { lines = '(?m)^name = "(?P<name>[^"]+)"\r?\nversion = "[^"]+"\r?\nsource = "(?P<version>git\+[^"]+)"', via = 'source' },
]

[[file]]
id = 'go'
globs = ['go.mod', 'go.work']
format = 'text'
registry = 'go'
rules = [
    # `require` and `exclude` lines and block entries; paths and versions may be quoted, as
    # go.dev/ref/mod#go-mod-file-lexical allows.
    { lines = '''(?m)^(?:require[ \t]+|exclude[ \t]+|[ \t]+)["`]?(?P<name>[\w.~-]+\.[\w.~/-]+)["`]?[ \t]+["`]?(?P<version>v\d[^\s"`]*)''' },
    # A `replace` names the module that stands in, at a version, or a local directory:
    # go.dev/ref/mod#go-mod-file-replace
    { lines = '''=>[ \t]*["`]?(?P<name>[\w.~-]+\.[\w.~/-]+)["`]?[ \t]+["`]?(?P<version>v\d[^\s"`]*)''' },
    { lines = '''(?m)^(?:replace[ \t]+|[ \t]+)["`]?(?P<name>[\w.~-]+\.[\w.~/-]+)["`]?(?:[ \t]+["`]?v[^\s"`]*["`]?)?[ \t]*=>[ \t]*["`]?(?P<version>\.{0,2}/[^\s"`]*)''' },
    # A go.work `use` names a module directory: go.dev/ref/mod#go-work-file-use
    { lines = '''(?m)^(?:use[ \t]+|[ \t]+)["`]?(?P<name>(?P<version>\.{1,2}(?:/[^\s"`]*)?))["`]?[ \t]*(?://[^\n]*)?\r?$''', via = 'directory' },
    # The `go` and `toolchain` directives pin the Go release itself.
    { lines = '(?m)^(?:go[ \t]+|toolchain[ \t]+go)(?P<version>\d[\w.]*)[ \t]*\r?$', via = 'golang' },
]

# dep and Glide, the Go package managers before modules.
[[file]]
id = 'gopkg'
globs = ['Gopkg.toml']
format = 'toml'
registry = 'go'
rules = [
    { record = 'constraint.*', name = 'name', version = 'version' },
    { record = 'override.*', name = 'name', version = 'version' },
]

[[file]]
id = 'glide'
globs = ['glide.yaml', 'glide.yml']
format = 'yaml'
registry = 'go'
rules = [
    { record = 'import.*', name = 'package', version = 'version' },
    { record = 'testImport.*', name = 'package', version = 'version' },
]

[[file]]
id = 'bazel'
globs = ['MODULE.bazel']
format = 'text'
registry = 'bazel'
rules = [
    { lines = 'bazel_dep\(\s*name\s*=\s*"(?P<name>[^"]+)"\s*,\s*version\s*=\s*"(?P<version>[^"]+)"' },
    # Overrides, as the fork's master read them: bazel.build/rules/lib/globals/module. Keyword
    # arguments come in any order, and `patches` lists may sit between the two, as in
    # github.com/bazelbuild/bazel/blob/master/MODULE.bazel.
    { lines = '(?s)(?-u:\b)module_name\s*=\s*"(?P<name>[^"]+)".*?(?-u:\b)version\s*=\s*"(?P<version>[^"]+)"', within = '${BAZEL_OVERRIDE}' },
    { lines = '(?s)(?-u:\b)version\s*=\s*"(?P<version>[^"]+)".*?(?-u:\b)module_name\s*=\s*"(?P<name>[^"]+)"', within = '${BAZEL_OVERRIDE}' },
    # `multiple_version_override(module_name, versions)` keeps several versions in the graph; master
    # asked it for a `version` it never has (bazel.build/rules/lib/globals/module). A match takes one
    # module name, so each rule reads the nth of the first four versions.
    { lines = 'multiple_version_override\(\s*module_name\s*=\s*"(?P<name>[^"]+)"\s*,\s*versions\s*=\s*\[\s*"(?P<version>[^"]+)"' },
    { lines = 'multiple_version_override\(\s*module_name\s*=\s*"(?P<name>[^"]+)"\s*,\s*versions\s*=\s*\[(?:\s*"[^"]*"\s*,){1}\s*"(?P<version>[^"]+)"' },
    { lines = 'multiple_version_override\(\s*module_name\s*=\s*"(?P<name>[^"]+)"\s*,\s*versions\s*=\s*\[(?:\s*"[^"]*"\s*,){2}\s*"(?P<version>[^"]+)"' },
    { lines = 'multiple_version_override\(\s*module_name\s*=\s*"(?P<name>[^"]+)"\s*,\s*versions\s*=\s*\[(?:\s*"[^"]*"\s*,){3}\s*"(?P<version>[^"]+)"' },
    { lines = 'git_override\(\s*module_name\s*=\s*"(?P<name>[^"]+)"[^)]*?commit\s*=\s*"(?P<version>[^"]+)"', via = 'source' },
    { lines = 'local_path_override\(\s*module_name\s*=\s*"(?P<name>[^"]+)"\s*,\s*path\s*=\s*"(?P<version>[^"]+)"', via = 'directory' },
]

[[file]]
id = 'vcpkg'
globs = ['vcpkg.json']
format = 'json'
registry = 'vcpkg'
rules = [
    { record = 'dependencies.*', name = 'name', version = 'version>=' },
    # A dependency may be a bare port name, and a feature lists its own dependencies:
    # learn.microsoft.com/en-us/vcpkg/reference/vcpkg-json#dependencies
    { spec = 'dependencies.*', pattern = '^(?P<name>[a-z0-9]+(?:-[a-z0-9]+)*)$' },
    { record = 'features.*.dependencies.*', name = 'name', version = 'version>=' },
    { spec = 'features.*.dependencies.*', pattern = '^(?P<name>[a-z0-9]+(?:-[a-z0-9]+)*)$' },
    { record = 'overrides.*', name = 'name', version = 'version|version-semver|version-string|version-date' },
    # An object without `version>=`, `{ "name": "openssl", "platform": "!windows" }`, takes the
    # baseline's version; its other fields are `default-features`, `features`, `host`, and
    # `platform`, on the page above.
    { lines = '''\{\s*"name"\s*:\s*"(?P<name>[a-z0-9]+(?:-[a-z0-9]+)*)"(?:\s*,\s*"(?:default-features|features|host|platform)"\s*:\s*(?:"[^"]*"|true|false|\[[^\]]*\]))*\s*\}''' },
]

# Conan names a requirement `name/version`: a line under conanfile.txt's `[requires]`, and in
# conanfile.py `requires = "zlib/1.3.1"`, `self.requires("zlib/1.3.1")`, or
# `self.tool_requires("tool/1.1.1")`: docs.conan.io/2/reference/conanfile/methods/requirements.html
# A version range sits in brackets, `openssl/[>=3 <4]`, `[~1.2]`, `[^1.2]`, `[1.2.*]`, or
# alternatives joined by `||`, and options such as `include_prerelease` follow a comma:
# docs.conan.io/2/tutorial/versioning/version_ranges.html and conan-io/conan,
# conan/internal/model/version_range.py. The span holds the expression before the options, which
# reads with the operators Conan shares: a bare version is exact, `~` bumps the minor of a
# two-part version, and `^` the first nonzero part.
[[file]]
id = 'conan'
globs = ['conanfile.txt', 'conanfile.py']
format = 'text'
registry = 'conan'
rules = [
    { lines = '''(?m)(?:^[ \t]*|requires\(\s*["']|["'])(?P<name>[a-z0-9][\w.+-]*)/(?P<version>\d[\w.+-]*)''' },
    { lines = '''(?m)(?:^[ \t]*|requires\(\s*["']|["'])(?P<name>[a-z0-9][\w.+-]*)/\[[ \t]*(?P<version>[^\],\s](?:[^\],]*[^\],\s])?)[ \t]*(?:,[^\]]*)?\]''' },
]

# A Spack environment lists specs as `name@version`, with variants after it, `@=` for an exact
# version, and `:` for a range: spack.readthedocs.io (lib/spack/docs/environments.rst)
[[file]]
id = 'spack'
globs = ['spack.yaml', 'spack.yml']
format = 'yaml'
registry = 'spack'
rules = [
    { spec = 'spack.specs.*', pattern = '^\s*(?P<name>[a-z0-9][\w-]*)[ \t]*@=?(?P<version>\d[\w.:]*)' },
]

[[file]]
id = 'shards'
globs = ['shard.yml']
format = 'yaml'
registry = 'github'
rules = [
    { record = 'dependencies.*', name = 'github', version = 'version' },
    { record = 'development_dependencies.*', name = 'github', version = 'version' },
]

[[file]]
id = 'mint'
globs = ['Mintfile']
format = 'text'
registry = 'github'
rules = [
    { lines = '(?m)^[ \t]*(?:https://github\.com/)?(?P<name>[\w.-]+/[\w.-]+?)(?:\.git)?@(?P<version>v?\d[\w.-]*)' },
]

# An update writes the whole version, as the fork's master wrote `~> 1.0` as `~> 2.0.0`; Carthage
# reads a missing patch as 0, so both select the same releases:
# github.com/Carthage/Carthage/blob/master/Source/CarthageKit/Version.swift
[[file]]
id = 'carthage'
globs = ['Cartfile', 'Cartfile.private']
format = 'text'
registry = 'github'
precise = true
rules = [
    { lines = '(?m)^[ \t]*github[ \t]+"(?P<name>[\w.-]+/[\w.-]+)"[ \t]+"?(?P<version>(?:~>|>=|==)?[ \t]*v?\d[\w.-]*)' },
    # A GitHub repository by URL, under `github` or `git`, and a quoted branch, tag, or commit,
    # which the fork's master read too: github.com/Carthage/Carthage/blob/master/Documentation/Artifacts.md#cartfile
    { lines = '(?m)^[ \t]*git(?:hub)?[ \t]+"(?:https?://github\.com/|git@github\.com:)(?P<name>[\w.-]+/[\w.-]+?)(?:\.git)?/?"[ \t]+"?(?P<version>(?:~>|>=|==)?[ \t]*v?\d[\w.-]*)' },
    { lines = '(?m)^[ \t]*git(?:hub)?[ \t]+"(?:https?://github\.com/|git@github\.com:)?(?P<name>[\w.-]+/[\w.-]+?)(?:\.git)?/?"[ \t]+"(?P<version>[^"\n]+)"', via = 'source' },
]

[[file]]
id = 'swift'
globs = ['Package.swift']
format = 'text'
registry = 'swift'
rules = [
    { lines = '\.package\(\s*(?:name:\s*"[^"]*"\s*,\s*)?url:\s*"https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"\s*,\s*(?:from:|exact:|\.exact\(|\.upToNextMajor\(from:|\.upToNextMinor\(from:)\s*"(?P<version>[^"]+)"' },
    # Other hosts, branches, revisions, and local packages need no lookup, as the fork's master
    # labeled them: docs.swift.org/package-manager/PackageDescription/PackageDescription.html#package-dependency
    { lines = '\.package\(\s*(?:name:\s*"[^"]*"\s*,\s*)?url:\s*"(?P<name>[^"]+)"\s*,\s*(?:from:|exact:|\.exact\(|\.upToNextMajor\(from:|\.upToNextMinor\(from:|branch:|revision:|\.revision\(|\.branch\()\s*"(?P<version>[^"]+)"', via = 'source' },
    { lines = '\.package\(\s*(?:name:\s*"[^"]*"\s*,\s*)?path:\s*"(?P<name>(?P<version>[^"]+))"', via = 'directory' },
]

# CPM.cmake and FetchContent. CPM's shorthand is `gh:owner/repo#tag` or `gh:owner/repo@version`,
# with an optional commit before the version (`#commit@version`); its named form gives
# `GITHUB_REPOSITORY` or `GIT_REPOSITORY` and `GIT_TAG` or `VERSION`, whose tag defaults to
# `v(VERSION)`, in any order within one call; and a `URL` may name a GitHub archive or release:
# github.com/cpm-cmake/CPM.cmake (README.md), as TheLartians/ModernCppStarter writes `GIT_TAG`
# before `GITHUB_REPOSITORY`. FetchContent_Declare takes the same `GIT_REPOSITORY`, `GIT_TAG`,
# and `URL`: cmake.org/cmake/help/latest/module/FetchContent.html. A gap stops at the call's `)`.
[[file]]
id = 'cmake'
globs = ['CMakeLists.txt', '*.cmake']
format = 'text'
registry = 'github'
rules = [
    # Each call starts on a line with no `#` before it, so a commented-out call stays unread, as the
    # fork's master skipped it: cmake.org/cmake/help/latest/manual/cmake-language.7.html#line-comment
    { lines = '''(?m)^[^#\n]*?gh:(?P<name>[\w.-]+/[\w.-]+?)#(?P<version>v?\d[\w.-]*)["\s)]''' },
    { lines = '(?m)^[^#\n]*?gh:(?P<name>[\w.-]+/[\w.-]+?)(?:#[^"@\s)]*)?@(?P<version>v?\d[\w.-]*)' },
    { lines = '(?m)^[^#\n]*?GITHUB_REPOSITORY\s+"?(?P<name>[\w.-]+/[\w.-]+?)"?(?:\s[^)]*?)?\s(?:GIT_TAG|VERSION)\s+"?(?P<version>v?\d[\w.-]*)' },
    { lines = '(?m)^[^#\n]*?[\s(](?:GIT_TAG|VERSION)\s+"?(?P<version>v?\d[\w.-]*)"?\s[^)]*?GITHUB_REPOSITORY\s+"?(?P<name>[\w.-]+/[\w.-]+?)"?\s' },
    { lines = '(?m)^[^#\n]*?GIT_REPOSITORY\s+"?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"?(?:\s[^)]*?)?\s(?:GIT_TAG|VERSION)\s+"?(?P<version>v?\d[\w.-]*)' },
    { lines = '(?m)^[^#\n]*?[\s(](?:GIT_TAG|VERSION)\s+"?(?P<version>v?\d[\w.-]*)"?\s[^)]*?GIT_REPOSITORY\s+"?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"?\s' },
    { lines = '(?m)^[^#\n]*?${GITHUB_ARCHIVE}' },
    { lines = '(?m)^[^#\n]*?${GITHUB_COMMIT_ARCHIVE}', via = 'source' },
    { lines = '(?m)^[^#\n]*?${GITHUB_RELEASE}' },
    # Hunter pins a package in cmake/Hunter/config.cmake with `hunter_config(name VERSION v)`:
    # hunter.readthedocs.io/en/latest/reference/user-modules/hunter_config.html
    { lines = '(?m)^[^#\n]*?hunter_config\(\s*(?P<name>[A-Za-z][\w.-]*)\s(?:[^)]*?\s)?VERSION\s+"?(?P<version>\d[\w.-]*)', via = 'hunter' },
]

# PlatformIO names a platform `platformio/name@spec` or `name @ spec`, and `lib_deps` lists one
# library a line as `owner/name @ spec`, where a bare version is exact and `^`, `~`, and
# comparisons follow semver: docs.platformio.org (projectconf/sections/env/options/platform/
# platform.rst, library/lib_deps.rst). `platform_packages` lists tools the same way, so tools,
# whose names start `toolchain-`, `framework-`, or `tool-`, are read first: the earlier rule keeps
# a span two rules match. A spec joins constraints with commas, `~5.6,!=5.4`. An owner-less name
# with a spec, `ArduinoJson @ ^7`, is found by the registry's name search, as `arduino` finds
# Arduino libraries (api.registry.platformio.org/v3/search?query=name:"ArduinoJson" lists
# bblanchon/library/ArduinoJson, 2026-11-25). A framework built-in, such as SPI or ESP8266WiFi,
# takes no spec, and the search lists none (query=name:"SPI" answers total 0).
[[file]]
id = 'platformio'
globs = ['platformio.ini']
format = 'text'
registry = 'platformio'
rules = [
    { lines = '(?m)^[ \t]*platform[ \t]*=[ \t]*(?:platformio/)?(?P<name>[\w-]+)[ \t]*@[ \t]*(?P<version>[~^<>=!]*[ \t]*\d[^\s;,]*(?:,[ \t]*[~^<>=!]+[ \t]*\d[^\s;,]*)*)', via = 'platformio-platform' },
    { lines = '(?m)^[ \t]*(?:platform_packages[ \t]*=[ \t]*)?(?P<name>[\w.-]+/(?:toolchain|framework|tool)-[\w.+-]+)[ \t]*@[ \t]*(?P<version>[~^<>=!]*[ \t]*\d[^\s;,]*(?:,[ \t]*[~^<>=!]+[ \t]*\d[^\s;,]*)*)', via = 'platformio-tool' },
    { lines = '(?m)^[ \t]*(?:lib_deps[ \t]*=[ \t]*)?(?P<name>[\w.-]+/[\w.+-]+(?:[ \t]+[\w.+-]+)*?)[ \t]*@[ \t]*(?P<version>[~^<>=!]*[ \t]*\d[^\s;,]*(?:,[ \t]*[~^<>=!]+[ \t]*\d[^\s;,]*)*)' },
    { lines = '(?m)^[ \t]*(?:lib_deps[ \t]*=[ \t]*)?(?P<name>[\w.+-]+(?:[ \t]+[\w.+-]+)*?)[ \t]*@[ \t]*(?P<version>[~^<>=!]*[ \t]*\d[^\s;,]*(?:,[ \t]*[~^<>=!]+[ \t]*\d[^\s;,]*)*)', via = 'arduino' },
]

# An Arduino library.properties lists `depends=Name, Other Name (>=1.0.0)`: comma-separated library
# names, which may hold spaces, each with an optional version constraint in parentheses:
# arduino/arduino-cli docs/library-specification.md and arduino-libraries/ArduinoIoTCloud.
[[file]]
id = 'arduino'
globs = ['library.properties']
format = 'ini'
registry = 'arduino'
rules = [
    { spec = 'depends', pattern = '(?P<name>[^,( \t][^,(]*?)[ \t]*(?:\((?P<version>[^)]*)\)[ \t]*)?(?:,|$)' },
]

# fpm, the Fortran package manager, takes a git dependency at a `tag`, inline or as a table:
# fpm.fortran-lang.org/spec/manifest.html (fortran-lang/fpm-docs, pages/spec/manifest.md).
[[file]]
id = 'fpm'
globs = ['fpm.toml']
format = 'text'
registry = 'github'
rules = [
    { lines = '''git[ \t]*=[ \t]*"https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"[ \t]*(?:,|\r?\n)\s*tag[ \t]*=[ \t]*"(?P<version>[^"]+)"''' },
]

# Boss, the Delphi package manager, keys `dependencies` by repository, as `"github.com/HashLoad/
# horse": "^3.0.0"`, and installs its tags: github.com/HashLoad/boss (README.md).
[[file]]
id = 'boss'
globs = ['boss.json']
format = 'text'
registry = 'github'
rules = [
    { lines = '"github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?"\s*:\s*"(?P<version>[^"]+)"' },
]

# ESP-IDF components list registry dependencies as `namespace/name: spec` or with a `version`
# key; a name without a namespace is in `espressif`, and `idf` pins ESP-IDF itself:
# docs.espressif.com/projects/idf-component-manager (reference/manifest_file.rst). Each name is
# read under `espressif/` first and as written second; a span both reads keep belongs to the
# first, and a name with two namespaces is no package.
[[file]]
id = 'idf-component'
globs = ['idf_component.yml']
format = 'yaml'
registry = 'esp'
rules = [
    { keys = 'dependencies', prefix = 'espressif/' },
    { keys = 'dependencies' },
]

[[file]]
id = 'cargo-config'
globs = ['.cargo/config.toml', '.cargo/config']
format = 'toml'
registry = 'cargo'
rules = [
    { keys = 'patch.*' },
]

# A toolchain is `<channel>[-<date>][-<host>]`, where the channel is `stable`, `beta`, `nightly`,
# or a release, `1.75.0-x86_64-apple-darwin`: rust-lang.github.io/rustup/concepts/toolchains.html.
# rust-toolchain.toml gives it as `[toolchain] channel`, and the legacy `rust-toolchain` file as its
# one line: rust-lang.github.io/rustup/overrides.html#the-toolchain-file. The TOML form is read as
# TOML so that an escaped channel, `"nightly\u002d2026\u002d09\u002d01"`, reads as its value; a
# legacy file is not TOML and yields no keys, which leaves it to the `lines` rules.
[[file]]
id = 'rust'
globs = ['rust-toolchain', 'rust-toolchain.toml']
format = 'toml'
registry = 'rust'
rules = [
    { spec = 'toolchain.channel', pattern = '^(?P<version>\d+\.\d+(?:\.\d+)?)(?:-[\w-]+)?$' },
    { spec = 'toolchain.channel', pattern = '^nightly-(?P<version>\d{4}-\d\d-\d\d)(?:-[\w-]+)?$', via = 'rust-nightly' },
    { spec = 'toolchain.channel', pattern = '^beta-(?P<version>\d{4}-\d\d-\d\d)(?:-[\w-]+)?$', via = 'rust-beta' },
    { spec = 'toolchain.channel', pattern = '^(?P<channel>stable)(?:-[a-z][\w-]*)?$' },
    { spec = 'toolchain.channel', pattern = '^(?P<channel>nightly)(?:-[a-z][\w-]*)?$', via = 'rust-nightly' },
    { spec = 'toolchain.channel', pattern = '^(?P<channel>beta)(?:-[a-z][\w-]*)?$', via = 'rust-beta' },
    { lines = '''\A\s*(?P<version>\d+\.\d+(?:\.\d+)?)(?:-[\w-]+)?\s*\z''' },
    { lines = '''\A\s*nightly-(?P<version>\d{4}-\d\d-\d\d)(?:-[\w-]+)?\s*\z''', via = 'rust-nightly' },
    { lines = '''\A\s*beta-(?P<version>\d{4}-\d\d-\d\d)(?:-[\w-]+)?\s*\z''', via = 'rust-beta' },
    { lines = '''\A\s*(?P<channel>stable)(?:-[a-z][\w-]*)?\s*\z''' },
    { lines = '''\A\s*(?P<channel>nightly)(?:-[a-z][\w-]*)?\s*\z''', via = 'rust-nightly' },
    { lines = '''\A\s*(?P<channel>beta)(?:-[a-z][\w-]*)?\s*\z''', via = 'rust-beta' },
]

[[file]]
id = 'golang'
globs = ['.go-version']
format = 'text'
registry = 'golang'
rules = [
    { lines = '\A\s*(?:go)?(?P<version>\d[\w.]*)\s*\z' },
]

[[file]]
id = 'zig'
globs = ['build.zig.zon']
format = 'text'
registry = 'github'
rules = [
    { lines = '${GITHUB_ARCHIVE}' },
    { lines = '${GITHUB_COMMIT_ARCHIVE}', via = 'source' },
    { lines = '${GITHUB_RELEASE}' },
    { lines = '${GITHUB_FRAGMENT}' },
    # A `.path` dependency is a local package: ziglang.org/download/0.14.0/release-notes.html#Package-Management
    # and github.com/ziglang/zig/blob/master/doc/build.zig.zon.md
    { lines = '\.@?"?(?P<name>[\w-]+)"?\s*=\s*\.\{\s*\.path\s*=\s*"(?P<version>[^"]+)"', via = 'directory' },
]

[[file]]
id = 'nimble'
globs = ['*.nimble']
format = 'text'
registry = 'github'
rules = [
    { lines = 'requires[ \t(]+"https?://github\.com/(?P<name>[\w.-]+/[\w-]+)(?:\.git)?[ \t]+(?P<version>(?:>=|<=|==|\^=|~=|>|<)[ \t]*v?\d[\w.-]*)"' },
    # `name#head` and `url#branch` follow a moving branch, as the fork's master labeled them:
    # nim-lang.github.io/nimble/create-packages.html#dependencies
    { lines = '"(?P<name>(?:https?://)?[\w./:-]+)#(?P<version>[\w./-]+)"', via = 'source' },
    # A bare name is a package of nim-lang/packages, `requires "jester >= 0.5", "karax"` with an
    # optional `==`, `>=`, `>`, `<=`, `<`, `^=`, or `~=` version, a bare one exact; `nim` is the
    # compiler, whose releases are nim-lang/Nim's tags: nim-lang/nimble's src/nimblepkg/version.nim.
    { lines = '(?m)(?:^[ \t]*requires\s*\(?\s*|,[ \t]*(?:\r?\n[ \t]*)?)"(?P<name>nim)[ \t]*(?P<version>(?:==|>=|<=|\^=|~=|>|<)?[ \t]*\d[\w.]*)"', via = 'github', prefix = 'nim-lang/' },
    { lines = '(?m)(?:^[ \t]*requires\s*\(?\s*|,[ \t]*(?:\r?\n[ \t]*)?)"(?P<name>[A-Za-z][\w]*)(?:[ \t]*(?P<version>(?:==|>=|<=|\^=|~=|>|<)?[ \t]*\d[\w.]*))?"', via = 'nimble' },
]

[[file]]
id = 'xmake'
globs = ['xmake.lua']
format = 'text'
registry = 'xmake'
rules = [
    # Each string `add_requires` lists is one package, `"name version"` or a bare name for the
    # newest, as the fork's master read `add_requires("zlib 1.3.1", "fmt 10.2.1")`; a line
    # comment, `--`, keeps the call unread: xmake.io/api/description/global-interfaces.html#add-requires
    { lines = '''(?:^|,)\s*["'](?P<name>[A-Za-z][\w.+-]*)(?:[ \t]+(?P<version>\d[\w.*]*))?["']''', within = '''(?m)^[ \t]*add_requires\((?P<body>[^)]*)\)''' },
]

[[file]]
id = 'meson-wrap'
globs = ['subprojects/*.wrap']
format = 'text'
registry = 'github'
rules = [
    { lines = '(?m)^[ \t]*url[ \t]*=[ \t]*https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?[ \t]*\r?\n(?:[^\n]*\n)*?[ \t]*revision[ \t]*=[ \t]*(?P<version>v?\d[\w.-]*)' },
    { lines = '${GITHUB_ARCHIVE}' },
    { lines = '${GITHUB_COMMIT_ARCHIVE}', via = 'source' },
    { lines = '${GITHUB_RELEASE}' },
    # A wrap from WrapDB carries the `patch_url` its release adds, which names the wrap and its
    # version, as GNOME/glib's subprojects/pcre2.wrap writes `.../v2/pcre2_10.46-1/get_patch`:
    # mesonbuild.com/Adding-new-projects-to-wrapdb.html
    { lines = '(?m)^[ \t]*patch_url[ \t]*=[ \t]*https://wrapdb\.mesonbuild\.com/v2/(?P<name>[\w.+-]+?)_(?P<version>\d[\w.]*-\d+)/get_patch', via = 'wrapdb' },
]

[[file]]
id = 'bazel-workspace'
globs = ['WORKSPACE', 'WORKSPACE.bazel']
format = 'text'
registry = 'github'
rules = [
    { lines = '${GITHUB_ARCHIVE}' },
    { lines = '${GITHUB_COMMIT_ARCHIVE}', via = 'source' },
    { lines = '${GITHUB_RELEASE}' },
]

# Buck2 fetches a source with `http_archive` or `http_file` from `urls`, and a GitHub archive or
# release asset names its repository and tag: buck2.build/docs/prelude/rules/core/http_archive and
# sluongng/buck2-go's toolchains/BUCK. A commit archive,
# `https://github.com/NixOS/nixpkgs/archive/5d73….tar.gz`, is the git reference it pins.
[[file]]
id = 'buck'
globs = ['BUCK', 'BUCK.v2', 'TARGETS', 'TARGETS.v2']
format = 'text'
registry = 'github'
rules = [
    { lines = '${GITHUB_ARCHIVE}' },
    { lines = '${GITHUB_COMMIT_ARCHIVE}', via = 'source' },
    { lines = '${GITHUB_RELEASE}' },
]

# West, Zephyr's meta-tool, lists `manifest.projects` with a `url` and a `revision`, a tag, branch,
# or commit: zephyrproject-rtos/zephyr, doc/develop/west/manifest.rst. A GitHub `url` with a
# release-like revision reads as that release, and any other revision as the git reference it
# pins. A project named through a `remote` takes its URL from that remote's `url-base`, which
# src/extract/west.rs joins, as zephyrproject-rtos/example-application's west.yml names zephyr.
[[file]]
id = 'west'
globs = ['west.yml']
format = 'yaml'
registry = 'github'
rules = [
    { lines = '''(?m)^[ \t]*(?:-[ \t]+)?url:[ \t]*["']?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?["']?[ \t]*\r?\n(?:[ \t]+[^\s-][^\n]*\r?\n)*?[ \t]+revision:[ \t]*["']?(?P<version>v?\d+\.\d[^"'\s#]*)''' },
    { lines = '''(?m)^[ \t]*(?:-[ \t]+)?revision:[ \t]*["']?(?P<version>v?\d+\.\d[^"'\s#]*)["']?[ \t]*\r?\n(?:[ \t]+[^\s-][^\n]*\r?\n)*?[ \t]+url:[ \t]*["']?https://github\.com/(?P<name>[\w.-]+/[\w-]+(?:\.[\w-]+)*?)(?:\.git)?["']?[ \t]*\r?$''' },
    { lines = '''(?m)^[ \t]*(?:-[ \t]+)?url:[ \t]*["']?(?P<name>https?://[^"'\s#]+?)(?:\.git)?["']?[ \t]*\r?\n(?:[ \t]+[^\s-][^\n]*\r?\n)*?[ \t]+revision:[ \t]*["']?(?P<version>[^"'\s#]+)''', via = 'source' },
    { lines = '''(?m)^[ \t]*(?:-[ \t]+)?revision:[ \t]*["']?(?P<version>[^"'\s#]+)["']?[ \t]*\r?\n(?:[ \t]+[^\s-][^\n]*\r?\n)*?[ \t]+url:[ \t]*["']?(?P<name>https?://[^"'\s#]+?)(?:\.git)?["']?[ \t]*\r?$''', via = 'source' },
]

# Pants declares a Python requirement with `python_requirement(requirements=[...])` and a JVM one
# with `jvm_artifact(group=, artifact=, version=)`: pantsbuild/pants, docs/docs/python/overview/
# third-party-dependencies.mdx and docs/docs/jvm/java-and-scala.mdx. Generators such as
# `python_requirements()` read requirements.txt or pyproject.toml, which their own rows read.
[[file]]
id = 'pants'
globs = ['BUILD', 'BUILD.pants']
format = 'text'
registry = 'pypi'
rules = [
    { lines = '''requirements\s*=\s*\[\s*["'](?P<name>[A-Za-z0-9][A-Za-z0-9._-]*)\s*(?:\[[^\]"']*\])?\s*(?P<version>(?:===|==|~=|!=|<=|>=|<|>)\s*[^;,"'\s]+(?:\s*,\s*(?:===|==|~=|!=|<=|>=|<|>)\s*[^;,"'\s]+)*)''' },
    { lines = '''jvm_artifact\(\s*group\s*=\s*["'](?P<group>[\w.-]+)["']\s*,\s*artifact\s*=\s*["'](?P<name>[\w.-]+)["']\s*,\s*version\s*=\s*["'](?P<version>[^"']+)["']''', via = 'maven' },
]


# Alire lists each `[[depends-on]]` table's crates as `name = "constraint"`, and a dynamic one
# under `'case(os)'.linux` or another case and value: alire-project/alire,
# doc/catalog-format-spec.md "depends-on", whose crates are strings, so a key three tables down is
# the crate a case value selects.
[[file]]
id = 'alire'
globs = ['alire.toml']
format = 'toml'
registry = 'alire'
rules = [{ keys = 'depends-on.*' }, { keys = 'depends-on.*.*.*' }]
