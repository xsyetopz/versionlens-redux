# JavaScript, web, and other package-manager ecosystems; see native.toml for the row format.

[[file]]
id = 'npm'
globs = ['package.json', 'package.json5']
format = 'json'
registry = 'npm'
rules = [{ spec = 'version', pattern = '${OWN}', via = 'project' }, { use = 'NPM_DEPS' }]

# Any other JSON file whose top level holds a package.json section, such as a web module's
# `web-module.json` with `dependencies` or `jspm`, reads as package.json does.
[[file]]
id = 'npm'
globs = ['*.json', '*.jsonc']
content = [
    'dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies',
    'bundledDependencies', 'bundleDependencies', 'overrides', 'packageManager', 'jspm', 'pnpm',
    'workspaces',
]
format = 'json'
registry = 'npm'
rules = [{ use = 'NPM_DEPS' }]

[[file]]
id = 'node'
globs = ['.nvmrc', '.node-version']
format = 'text'
registry = 'npm'
rules = [
    { lines = '${TOOL_VERSION}' },
]

# Bower's registry only names each package's Git repository; the packages it still serves
# publish the same versions to npm.
[[file]]
id = 'bower'
globs = ['bower.json']
format = 'json'
registry = 'npm'
rules = [
    { keys = 'dependencies' },
    { keys = 'devDependencies' },
    { keys = 'resolutions' },
]

[[file]]
id = 'bun'
globs = ['.bun-version']
format = 'text'
registry = 'npm'
rules = [
    { lines = '${TOOL_VERSION}' },
]

[[file]]
id = 'pnpm'
globs = ['pnpm-workspace.yaml', 'pnpm-workspace.yml', 'package.yaml', 'package.yml', '.yarnrc.yml', '.yarnrc.yaml']
format = 'yaml'
registry = 'npm'
rules = [{ use = 'NPM_DEPS' }]

[[file]]
id = 'deno'
globs = ['deno.json', 'deno.jsonc', 'import_map.json', 'jsr.json', 'jsr.jsonc']
format = 'json'
registry = 'jsr'
rules = [
    { spec = 'version', pattern = '${OWN}', via = 'project' },
    { spec = 'imports.*', pattern = '^(?P<registry>jsr|npm):(?P<name>@?[^@]+)@(?P<version>.+)$' },
    { spec = 'scopes.*.*', pattern = '^(?P<registry>jsr|npm):(?P<name>@?[^@]+)@(?P<version>.+)$' },
]

# Component names packages by GitHub repository, in `dependencies` and `development.dependencies`:
# github.com/componentjs/spec/blob/master/component.json/specifications.md
[[file]]
id = 'component'
globs = ['component.json']
format = 'json'
registry = 'github'
rules = [
    { keys = 'dependencies' },
    { keys = 'development.dependencies' },
]

# PEAR 2.0 package.xml: `package` dependencies come from the PEAR channel and `extension` ones
# from PECL, each with a `min` or `recommended` version:
# pear.php.net/manual/en/guide.developers.package2.dependencies.php, and the package.xml of
# github.com/pear/Console_Table and github.com/php-memcached-dev/php-memcached.
[[file]]
id = 'pear'
globs = ['package.xml', 'package2.xml']
format = 'xml'
registry = 'pear'
rules = [
    { record = 'package.dependencies.required.package', name = 'name', version = 'min|recommended' },
    { record = 'package.dependencies.optional.package', name = 'name', version = 'min|recommended' },
    { record = 'package.dependencies.group.package', name = 'name', version = 'min|recommended' },
    { record = 'package.dependencies.required.extension', name = 'name', version = 'min|recommended', via = 'pecl' },
    { record = 'package.dependencies.optional.extension', name = 'name', version = 'min|recommended', via = 'pecl' },
    { record = 'package.dependencies.group.extension', name = 'name', version = 'min|recommended', via = 'pecl' },
]

[[file]]
id = 'unity'
globs = ['Packages/manifest.json']
format = 'json'
registry = 'unity'
rules = [
    { keys = 'dependencies' },
]

[[file]]
id = 'composer'
globs = ['composer.json']
format = 'json'
registry = 'composer'
rules = [
    { spec = 'version', pattern = '${OWN}', via = 'project' },
    { keys = 'require' },
    { keys = 'require-dev' },
    # Constraints on other packages, which the fork's master read too:
    # getcomposer.org/doc/04-schema.md#conflict
    { keys = 'conflict' },
    { keys = 'replace' },
    { keys = 'provide' },
]

[[file]]
id = 'haxelib'
globs = ['haxelib.json']
format = 'json'
registry = 'haxelib'
rules = [
    { keys = 'dependencies' },
]

[[file]]
id = 'hxml'
globs = ['*.hxml']
format = 'text'
registry = 'haxelib'
insert = ':'
rules = [
    { lines = '(?m)^[ \t]*-(?:-library|lib|L)[ \t]+(?P<name>[\w.-]+)(?::(?P<version>[\w.+-]+))?[ \t]*\r?$' },
]

[[file]]
id = 'dub'
globs = ['dub.json', 'dub.selections.json']
format = 'json'
registry = 'dub'
rules = [
    { keys = 'dependencies' },
    { keys = 'versions' },
    # A build configuration adds dependencies: dub.pm/dub-reference/configurations/
    { keys = 'configurations.*.dependencies' },
]

[[file]]
id = 'dub-sdl'
globs = ['dub.sdl']
format = 'text'
registry = 'dub'
rules = [
    # Attributes come in any order; `path` names a local package, and beside `repository` the
    # `version` is a git commit: dub.pm/dub-reference/dependencies/. The commit rules come first,
    # so they win the span the registry rule also matches.
    { lines = '(?m)^[ \t]*dependency[ \t]+"(?P<name>[^"]+)"[^\n#]*?[ \t]repository="[^"]+"[^\n#]*?[ \t]version="(?P<version>[^"]+)"', via = 'source' },
    { lines = '(?m)^[ \t]*dependency[ \t]+"(?P<name>[^"]+)"[^\n#]*?[ \t]version="(?P<version>[^"]+)"[^\n#]*?[ \t]repository="', via = 'source' },
    { lines = '(?m)^[ \t]*dependency[ \t]+"(?P<name>[^"]+)"[^\n#]*?[ \t]version="(?P<version>[^"]+)"' },
    { lines = '(?m)^[ \t]*dependency[ \t]+"(?P<name>[^"]+)"[^\n#]*?[ \t]path="(?P<version>[^"]+)"', via = 'directory' },
]

[[file]]
id = 'elm'
globs = ['elm.json']
format = 'json'
registry = 'elm'
rules = [
    { keys = 'dependencies.direct' },
    { keys = 'dependencies.indirect' },
    { keys = 'test-dependencies.direct' },
    { keys = 'test-dependencies.indirect' },
]

# Lockfiles hold the version each package resolved to, so the lens compares it with the latest.

# `packages` keys a package by its `node_modules/` path in lockfile v2 and v3, and v1 nests
# `dependencies` by name; either way `version` comes first. Workspace entries start with `name`,
# and links carry no version. Read from github.com/npm/cli/blob/latest/package-lock.json.
[[file]]
id = 'package-lock'
globs = ['package-lock.json', 'npm-shrinkwrap.json']
format = 'text'
registry = 'npm'
rules = [
    { lines = '"(?:[^"\n]*node_modules/)?(?P<name>(?:@[\w.-]+/)?[\w.-]+)":[ \t]*\{\s*"version":[ \t]*"(?P<version>\d[^"]*)"' },
]

# An entry heads one or more `name@range` keys, then `version "1.0.0"` in Yarn 1
# (github.com/babel/babel/blob/v7.0.0/yarn.lock) or `version: 1.0.0` in Yarn 2 and later
# (github.com/yarnpkg/berry/blob/master/yarn.lock). Ranges must start like a version or `npm:`
# one, so workspace, patch, git, and aliased entries stay out.
[[file]]
id = 'yarn-lock'
globs = ['yarn.lock']
format = 'text'
registry = 'npm'
rules = [
    { lines = '(?m)^"?(?P<name>(?:@[\w.-]+/)?[\w.-]+)@(?:npm:)?[\^~<>=*\dvx][^\n]*:\r?\n[ \t]+version:?[ \t]+"?(?P<version>\d[^"\s]*)' },
]

# Each importer lists its direct dependencies as `name:`, `specifier:`, then the resolved
# `version:`, whose peer suffix `(react@18.2.0)` and `link:` versions stay out. pnpm 8 and later
# write this shape: github.com/vitejs/vite/blob/main/pnpm-lock.yaml.
[[file]]
id = 'pnpm-lock'
globs = ['pnpm-lock.yaml']
format = 'text'
registry = 'npm'
rules = [
    { lines = '''(?m)^[ \t]+'?(?P<name>(?:@[\w.-]+/)?[\w.-]+)'?:\r?\n[ \t]+specifier:[^\n]*\r?\n[ \t]+version:[ \t]+'?(?P<version>\d[\w.+-]*)''' },
]

# Bun's text lockfile maps each package path to `["name@version", ...]`; the name comes from the
# value, which also covers nested and aliased paths: bun.sh/docs/install/lockfile, and this
# repository's own bun.lock. Workspace and git entries carry no version.
[[file]]
id = 'bun-lock'
globs = ['bun.lock']
format = 'text'
registry = 'npm'
rules = [
    { lines = '"[^"\n]+":[ \t]*\[[ \t]*"(?P<name>(?:@[\w.-]+/)?[\w.-]+)@(?P<version>\d[^"]*)"' },
]

# Installed packages: github.com/composer/composer/blob/main/composer.lock
[[file]]
id = 'composer-lock'
globs = ['composer.lock']
format = 'json'
registry = 'composer'
rules = [
    { record = 'packages.*', name = 'name', version = 'version' },
    { record = 'packages-dev.*', name = 'name', version = 'version' },
]

