# Registries for language runtimes, build tools, and the smaller package indexes. Runtimes
# answer for tool-version files such as `.python-version` and `.tool-versions`. See packages.toml
# for the row format.

[[registry]]
id = 'rust'
url = 'https://raw.githubusercontent.com/rust-lang/rust/master/RELEASES.md'
regex = '(?m)^Version (\d+\.\d+\.\d+) \('
bare = 'prefix'
osv = 'GIT'
osv_name = 'https://github.com/rust-lang/rust'
page = 'https://www.rust-lang.org/tools/install'

# Typst's changelog lists each release once in its body, `<li><a href="/docs/changelog/0.13.0/">`,
# and once more in the navigation; crates.io's typst-cli skips 0.2 through 0.10, which the
# `compiler` minimum of a typst.toml still names.
[[registry]]
id = 'typst-compiler'
url = 'https://typst.app/docs/changelog/'
regex = '(?i)<li><a href="/docs/changelog/(\d+\.\d+\.\d+)/">'
bare = 'prefix'
osv = 'GIT'
osv_name = 'https://github.com/typst/typst'
page = 'https://typst.app/docs/changelog/'

# Stackage names the newest snapshot of each LTS series, `{"lts-22":"lts-22.44",…}`, which a
# stack.yaml `resolver: lts-22.43` moves to.
[[registry]]
id = 'stackage'
url = 'https://www.stackage.org/download/snapshots.json'
regex = '"lts-\d+":\s*"lts-(\d+\.\d+)"'
bare = 'prefix'
page = 'https://www.stackage.org/'

# Julia's own release list, keyed by version, which `julia` in a Project.toml `[compat]` names.
[[registry]]
id = 'julia-lang'
url = 'https://julialang-s3.julialang.org/bin/versions.json'
json = ''
field = '@key'
bare = 'caret'
page = 'https://julialang.org/downloads/'

# R's releases from R-hub's rversions service, which `R (>= 4.3)` in a DESCRIPTION names.
[[registry]]
id = 'r-lang'
url = 'https://api.r-hub.io/rversions/r-versions'
json = ''
field = 'version'
bare = 'prefix'
page = 'https://cran.r-project.org/'

# Deno's release notes head each release `### 2.1.4 / 2024.12.11`; its advisories are filed
# against the `deno` crate.
[[registry]]
id = 'deno-cli'
url = 'https://raw.githubusercontent.com/denoland/deno/main/Releases.md'
regex = '(?m)^### (\d+\.\d+\.\d+) /'
bare = 'prefix'
osv = 'crates.io'
osv_name = 'deno'
page = 'https://github.com/denoland/deno/releases'

# The .NET release index gives each channel's newest SDK, `"latest-sdk": "8.0.404"`, so a
# `dotnet-version` gets the newest SDK of each channel rather than every patch.
[[registry]]
id = 'dotnet-sdk'
url = 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json'
json = 'releases-index'
field = 'latest-sdk'
bare = 'prefix'
osv = 'Bitnami'
osv_name = 'dotnet-sdk'
page = 'https://dotnet.microsoft.com/download/dotnet'

# Adoptium lists the Java feature releases Temurin builds, `"available_releases": [8, 11, …]`,
# the majors a setup-java `java-version` names.
[[registry]]
id = 'temurin'
url = 'https://api.adoptium.net/v3/info/available_releases'
json = 'available_releases'
bare = 'prefix'
osv = 'Bitnami'
osv_name = 'java'
page = 'https://adoptium.net/temurin/releases/'

# OSV's Bitnami ecosystem carries the runtimes' own CVEs, under each product's name.
[[registry]]
id = 'python'
url = 'https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json'
json = ''
field = 'version'
bare = 'prefix'
osv = 'Bitnami'
osv_name = 'python'
page = 'https://www.python.org/downloads/'

[[registry]]
id = 'ruby'
url = 'https://raw.githubusercontent.com/ruby/www.ruby-lang.org/master/_data/releases.yml'
regex = '(?m)^- version: (\d\S*)'
bare = 'prefix'
osv = 'Bitnami'
osv_name = 'ruby'
page = 'https://www.ruby-lang.org/en/downloads/'

[[registry]]
id = 'nodejs'
url = 'https://nodejs.org/dist/index.json'
json = ''
field = 'version'
bare = 'prefix'
osv = 'Bitnami'
osv_name = 'node'
page = 'https://nodejs.org/en/about/previous-releases'

[[registry]]
id = 'ghc'
url = 'https://downloads.haskell.org/~ghc/'
regex = 'href="(\d+\.\d+\.\d+)/"'
bare = 'prefix'
osv = 'GHC'
osv_name = 'ghc'
page = 'https://www.haskell.org/ghc/'

[[registry]]
id = 'golang'
url = 'https://go.dev/dl/?mode=json&include=all'
reader = 'go-releases'
bare = 'prefix'
osv = 'Go'
osv_name = 'stdlib'
accept = 'application/json'
page = 'https://go.dev/dl/'

[[registry]]
id = 'terraform-cli'
url = 'https://releases.hashicorp.com/terraform/index.json'
json = 'versions'
field = '@key'
bare = 'prefix'
osv = 'GIT'
osv_name = 'https://github.com/hashicorp/terraform'
page = 'https://releases.hashicorp.com/terraform/'

[[registry]]
id = 'gradle-dist'
url = 'https://services.gradle.org/versions/all'
json = ''
field = 'version'
bare = 'exact'
osv = 'Bitnami'
osv_name = 'gradle'
page = 'https://gradle.org/releases/'

[[registry]]
id = 'conda'
url = 'https://api.anaconda.org/package/conda-forge/{name}'
json = 'versions'
bare = 'prefix'
osv = 'GIT'
osv_name = 'https://api.anaconda.org/package/conda-forge/{name}'
upstream = '"dev_url":\s*"${GITHUB_URL}'
page = 'https://anaconda.org/conda-forge/{name}'

[[registry]]
id = 'elm'
url = 'https://package.elm-lang.org/packages/{name}/releases.json'
json = ''
field = '@key'
bare = 'exact'
osv = 'GIT'
osv_name = 'https://github.com/{name}'
page = 'https://package.elm-lang.org/packages/{name}/latest/'

[[registry]]
id = 'luarocks'
url = 'https://luarocks.org/manifest.json'
json = 'repository/{name}'
field = '@key'
bare = 'exact'
osv = 'GIT'
osv_name = 'https://luarocks.org/{name}-{version}.rockspec'
upstream = '''url\s*=\s*['"](?:git\+)?(?:https?|git)://github\.com/(?P<owner>[\w.-]+)/(?P<repo>[\w.-]+?)(?:\.git)?/?['"]'''
page = 'https://luarocks.org/search?q={name}'

[[registry]]
id = 'xmake'
url = 'https://raw.githubusercontent.com/xmake-io/xmake-repo/master/packages/{first}/{lower}/xmake.lua'
regex = 'add_versions\("(?:[a-z]+:)?([^"]+)"'
bare = 'exact'
osv = 'GIT'
osv_name = 'https://raw.githubusercontent.com/xmake-io/xmake-repo/master/packages/{first}/{lower}/xmake.lua'
upstream = '"https?://github\.com/(?P<owner>[\w.-]+)/(?P<repo>[\w.-]+?)(?:\.git)?["/]'
page = 'https://xmake.io/#/package/remote_package'

