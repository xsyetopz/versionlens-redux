[workspace]
members = [
  "crates/versionlens-engine",
  "crates/versionlens-fetch",
  "crates/versionlens-lsp",
  "crates/versionlens-model",
  "crates/versionlens-parsers",
  "crates/versionlens-providers",
  "crates/versionlens-test-support",
  "crates/versionlens-update", "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "ISC"
repository = "https://github.com/xsyetopz/versionlens-redux.git"
readme = "README.md"
keywords = ["versionlens", "vscode", "dependencies"]
categories = ["development-tools"]
version = "0.6.3"

[workspace.dependencies]
ignore = "0.4.33"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
sha2 = "0.11.1"
crossbeam-channel = "0.5.17"
base64 = "0.23.1"
anyhow = "1.0.104"
jsonc-parser = "0.34.0"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
marked-yaml = "0.8.0"
quick-xml = "0.42.0"
regex-automata = { version = "0.4.18", default-features = false, features = [
  "meta",
  "std",
  "syntax",
  "unicode",
] }
regex-syntax = { version = "0.8.11", default-features = false, features = [
  "std",
] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml_edit = "0.25.17"
unicode-normalization = "0.1.25"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
] }
flate2 = "1.1.10"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
versionlens-engine = { path = "crates/versionlens-engine" }
versionlens-fetch = { path = "crates/versionlens-fetch" }
versionlens-lsp = { path = "crates/versionlens-lsp" }
versionlens-model = { path = "crates/versionlens-model" }
versionlens-parsers = { path = "crates/versionlens-parsers" }
versionlens-providers = { path = "crates/versionlens-providers" }
versionlens-test-support = { path = "crates/versionlens-test-support" }
versionlens-update = { path = "crates/versionlens-update" }
# Managed by rust-bedrock. Every level is deny rather than forbid, so a crate can
# opt out of one lint with a crate-root #![expect(lint, reason = "…")].
[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
# Docs are required on the public API only: rustc and Clippy skip pub(crate)
# and private items, and unreachable_pub makes `pub` mean public.
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unit_bindings = "deny"
ambiguous_negative_literals = "deny"
redundant_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Pedantic includes missing_panics_doc and missing_errors_doc: a public function
# documents its `# Panics` and `# Errors`.
pedantic = { level = "deny", priority = -1 }
# Pedantic lints that flag readable code more often than bugs.
must_use_candidate = "allow"
similar_names = "allow"
match_same_arms = "allow"
if_not_else = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
# Nursery lints with no false positives seen on 1.99.
branches_sharing_code = "deny"
collection_is_never_read = "deny"
derive_partial_eq_without_eq = "deny"
equatable_if_let = "deny"
needless_collect = "deny"
set_contains_or_insert = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
use_self = "deny"
while_float = "deny"
# Only `#[expect(lint, reason = "…")]` may silence a lint.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Restriction lints for panics, output, ignored results, and unsafe code.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "deny"
tests_outside_test_module = "deny"
mod_module_files = "deny"
as_underscore = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
# Cargo manifest lints.
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"

# Checked by `cargo doc`: broken links, public docs that link to private items,
# and malformed code blocks and HTML.
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = 0
incremental = false
overflow-checks = true

[profile.release-with-checks]
inherits = "release"
overflow-checks = true
debug-assertions = true
