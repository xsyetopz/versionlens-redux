pre-commit:
  commands:
    snapshot:
      run: >-
        git diff --quiet && git diff --cached --check &&
        test -z "$(git ls-files --others --exclude-standard)"
    style:
      run: just check-style
    typecheck:
      run: bun run typecheck

pre-push:
  commands:
    snapshot:
      run: >-
        git diff --quiet &&
        git diff --cached --quiet &&
        test -z "$(git ls-files --others --exclude-standard)"
    verify:
      run: just verify
