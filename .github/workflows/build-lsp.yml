name: Build LSP

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the combined artifact; per-target artifacts derive from it.
        type: string
        default: versionlens-lsp
    outputs:
      version:
        description: versionlens-lsp crate version used in the archive names.
        value: ${{ jobs.checksums.outputs.version }}
      archives-artifact:
        description: Artifact holding the 9 archives and SHA256SUMS.
        value: ${{ jobs.checksums.outputs.release-artifact }}
      checksums-file:
        description: Name of the checksum file inside the release artifact.
        value: ${{ jobs.checksums.outputs.checksums-file }}
  workflow_dispatch:
    inputs:
      artifact-name:
        description: Name of the combined artifact; per-target artifacts derive from it.
        type: string
        default: versionlens-lsp

permissions:
  contents: read

jobs:
  setup:
    name: Resolve targets and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read target matrix
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(jq -c '{include: [.targets[] | {vscode_target: .vscode, rust_target: .rust}]}' scripts/package/targets.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Read crate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          read_version() {
            sed -n 's/^version = "\(.*\)"/\1/p' "$1" | head -n 1
          }
          if grep -q '^version.workspace = true' crates/versionlens-lsp/Cargo.toml; then
            version=$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          else
            version=$(read_version crates/versionlens-lsp/Cargo.toml)
          fi
          [[ -n "$version" ]] || { echo "Could not determine versionlens-lsp version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: LSP (${{ matrix.vscode_target }})
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ contains(matrix.rust_target, 'windows') && (contains(matrix.rust_target, 'aarch64') && 'windows-11-arm' || 'windows-latest') || contains(matrix.rust_target, 'apple-darwin') && (contains(matrix.rust_target, 'aarch64') && 'macos-15' || 'macos-15-intel') || (matrix.rust_target == 'aarch64-unknown-linux-gnu' && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    timeout-minutes: 45
    env:
      RUST_TARGET: ${{ matrix.rust_target }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Rust target
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.rust_target }}

      # All Linux targets build with zig: musl, and gnu with a glibc 2.28 floor.
      - name: Setup Zig cross-compilation
        if: contains(matrix.rust_target, 'linux')
        shell: bash
        run: |
          python3 -m pip install ziglang==0.15.2
          cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Cache Cargo registry and target
        uses: ./.github/actions/cache-cargo-target
        with:
          scope: lsp

      - name: Build versionlens-lsp
        shell: bash
        run: |
          set -euo pipefail
          # Static executables: musl, and MSVC (no VCRUNTIME140.dll dependency).
          if [[ "$RUST_TARGET" == *-musl || "$RUST_TARGET" == *-windows-msvc ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          if [[ "$RUST_TARGET" == *-linux-* ]]; then
            # gnu targets get a glibc 2.28 floor; output still lands in target/<triple>/.
            zig_target="$RUST_TARGET"
            if [[ "$RUST_TARGET" == *-gnu || "$RUST_TARGET" == *-gnueabihf ]]; then
              zig_target="${RUST_TARGET}.2.28"
            fi
            cargo zigbuild -p versionlens-lsp --bin versionlens-lsp --release --locked --target "$zig_target"
          else
            cargo build -p versionlens-lsp --bin versionlens-lsp --release --locked --target "$RUST_TARGET"
          fi

      - name: Archive binary
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          name="versionlens-lsp-${VERSION}-${RUST_TARGET}"
          release_dir="target/${RUST_TARGET}/release"
          mkdir -p dist
          if [[ "$RUST_TARGET" == *-windows-* ]]; then
            file="${name}.zip"
            if command -v 7z >/dev/null 2>&1; then
              (cd "$release_dir" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$file" versionlens-lsp.exe)
            else
              /c/Windows/System32/tar.exe -a -cf "dist/$file" -C "$release_dir" versionlens-lsp.exe
            fi
          elif [[ "$RUST_TARGET" == *-apple-darwin ]]; then
            file="${name}.tar.gz"
            # Avoid AppleDouble (._*) entries and xattrs from bsdtar.
            COPYFILE_DISABLE=1 tar --no-xattrs -C "$release_dir" -czf "dist/$file" versionlens-lsp
          else
            file="${name}.tar.gz"
            tar -C "$release_dir" -czf "dist/$file" versionlens-lsp
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-archive-${{ matrix.rust_target }}
          path: dist/${{ steps.archive.outputs.file }}
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ needs.setup.outputs.version }}
      release-artifact: ${{ inputs.artifact-name }}
      checksums-file: SHA256SUMS
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download archives
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ inputs.artifact-name }}-archive-*
          path: dist
          merge-multiple: true

      - name: Verify archives and write SHA256SUMS
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          expected=$(jq -r '.targets | length' ../scripts/package/targets.json)
          count=$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          if [[ "$count" != "$expected" ]]; then
            echo "Expected $expected archives, found $count" >&2
            ls -la
            exit 1
          fi
          for rust_target in $(jq -r '.targets[].rust' ../scripts/package/targets.json); do
            case "$rust_target" in
              *-windows-*) ext=zip ;;
              *) ext=tar.gz ;;
            esac
            file="versionlens-lsp-${VERSION}-${rust_target}.${ext}"
            [[ -f "$file" ]] || { echo "Missing archive $file" >&2; exit 1; }
          done
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" = "$expected"
          cat SHA256SUMS

      - name: Upload archives and SHA256SUMS
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
