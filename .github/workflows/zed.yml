name: Zed CI/CD

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Zed checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt

      - name: Cache Zed Cargo registry and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            packages/zed-extension/target
          key: ${{ runner.os }}-cargo-zed-${{ hashFiles('Cargo.lock', 'packages/zed-extension/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zed-
            ${{ runner.os }}-cargo-

      - name: Check Zed extension
        run: cargo check --manifest-path packages/zed-extension/Cargo.toml --locked

      - name: Test Zed extension
        run: cargo test --manifest-path packages/zed-extension/Cargo.toml --locked

      - name: Build Zed extension
        run: cargo build --manifest-path packages/zed-extension/Cargo.toml --release --locked

  package:
    name: Zed package (${{ matrix.editor_target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - editor_target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            runner: ubuntu-latest
          - editor_target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - editor_target: darwin-x64
            rust_target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            runner: macos-15-intel
          - editor_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            runner: macos-15
          - editor_target: win32-x64
            rust_target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            runner: windows-latest
          - editor_target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
            platform: win32
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build and package Zed extension
        uses: ./.github/actions/package-lsp-editor
        with:
          arch: ${{ matrix.arch }}
          package-script: scripts/package/zed.mjs
          platform: ${{ matrix.platform }}
          rust-target: ${{ matrix.rust_target }}
          scope: zed

      - name: Upload Zed artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: versionlens-redux-zed-extension-${{ matrix.editor_target }}
          path: dist/versionlens-redux-zed-extension-${{ matrix.editor_target }}.tar.gz
          if-no-files-found: error
