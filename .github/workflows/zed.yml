name: Zed CI/CD

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Zed checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt
          target: wasm32-wasip2

      - name: Cache Zed Cargo registry and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            packages/zed-extension/target
          key: ${{ runner.os }}-cargo-zed-${{ hashFiles('Cargo.lock', 'packages/zed-extension/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zed-
            ${{ runner.os }}-cargo-

      - name: Check Zed extension
        run: cargo check --manifest-path packages/zed-extension/Cargo.toml --target wasm32-wasip2 --locked

      - name: Test Zed extension
        run: cargo test --manifest-path packages/zed-extension/Cargo.toml --locked
