# Managed by bedrock.
name: Rust

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tests may read git history, such as a baseline kept at an older commit.
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      # kache caches compiled crates and keeps its store in the GitHub Actions cache.
      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        with:
          version: v2.0.0
          # The comment needs pull-requests: write; the job summary shows the same.
          pr-comment: "false"
      # uv runs the pinned lizard that bedrock guard bounds sizes with.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.59.0,cargo-deny@0.20.2,uv@0.13.7
      - run: just rust::verify
