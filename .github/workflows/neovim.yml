name: Neovim CI/CD

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      lsp-artifact:
        description: Artifact from an earlier build-lsp run. Empty builds the language server in this run.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Neovim lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # NTBBloodbath/selene-action is gone from GitHub; install-action fetches Selene through
      # cargo-binstall, which resolves versions on crates.io, where 0.31.0 is the newest.
      - name: Install Selene
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: selene@0.31.0

      - name: Lint with Selene
        working-directory: packages/neovim-plugin
        run: selene --config selene.toml lua plugin tests

      - name: Check formatting with StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --config-path packages/neovim-plugin/.stylua.toml --check packages/neovim-plugin/lua packages/neovim-plugin/plugin packages/neovim-plugin/tests

  test:
    name: Neovim test (${{ matrix.neovim }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.11.5
          - stable
          - nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run tests against the server
        run: make -C packages/neovim-plugin test

  targets:
    name: Neovim package targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Define native targets
        id: targets
        shell: bash
        run: echo 'matrix={"include":[{"editor_target":"linux-x64","rust_target":"x86_64-unknown-linux-gnu","platform":"linux","arch":"x64","runner":"ubuntu-latest"},{"editor_target":"linux-arm64","rust_target":"aarch64-unknown-linux-gnu","platform":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"},{"editor_target":"darwin-x64","rust_target":"x86_64-apple-darwin","platform":"darwin","arch":"x64","runner":"macos-15-intel"},{"editor_target":"darwin-arm64","rust_target":"aarch64-apple-darwin","platform":"darwin","arch":"arm64","runner":"macos-15"},{"editor_target":"win32-x64","rust_target":"x86_64-pc-windows-msvc","platform":"win32","arch":"x64","runner":"windows-latest"},{"editor_target":"win32-arm64","rust_target":"aarch64-pc-windows-msvc","platform":"win32","arch":"arm64","runner":"windows-11-arm"}]}' >> "$GITHUB_OUTPUT"

  lsp:
    name: Build language server
    if: ${{ !inputs.lsp-artifact }}
    uses: ./.github/workflows/build-lsp.yml

  package:
    name: Neovim package (${{ matrix.editor_target }})
    needs:
      - lint
      - test
      - targets
      - lsp
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.targets.result == 'success' && (needs.lsp.result == 'success' || needs.lsp.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build and package Neovim plugin
        uses: ./.github/actions/package-lsp-editor
        with:
          arch: ${{ matrix.arch }}
          package-script: scripts/package/neovim.mjs
          platform: ${{ matrix.platform }}
          rust-target: ${{ matrix.rust_target }}
          lsp-artifact: ${{ inputs.lsp-artifact || 'versionlens-lsp' }}

      - name: Upload Neovim artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: versionlens-redux-neovim-plugin-${{ matrix.editor_target }}
          path: dist/versionlens-redux-neovim-plugin-${{ matrix.editor_target }}.tar.gz
          if-no-files-found: error
