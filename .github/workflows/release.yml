name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version matching every package manifest
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release ref and version
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate release ref and version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Releases must be dispatched from master, not $GITHUB_REF" >&2
            exit 1
          fi

          remote_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$GITHUB_SHA" != "$remote_master" ]]; then
            echo "Release commit $GITHUB_SHA is not current master $remote_master" >&2
            exit 1
          fi

          bun scripts/release/version.mjs "$VERSION" --check

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

  lsp:
    name: Build language server
    needs: validate
    uses: ./.github/workflows/build-lsp.yml
    with:
      artifact-name: versionlens-lsp

  vscode:
    name: VS Code
    needs: lsp
    uses: ./.github/workflows/vscode.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}

  zed:
    name: Zed
    uses: ./.github/workflows/zed.yml

  neovim:
    name: Neovim
    needs: lsp
    uses: ./.github/workflows/neovim.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}

  jetbrains:
    name: JetBrains
    needs: lsp
    uses: ./.github/workflows/jetbrains.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}

  release:
    name: Create tag and release
    needs: [validate, lsp, vscode, zed, neovim, jetbrains]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download VSIX packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: versionlens-redux-vsix
          path: release-assets

      - name: Download Neovim packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: versionlens-redux-neovim-plugin-*
          path: release-assets
          merge-multiple: true

      - name: Download JetBrains packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: versionlens-redux-jetbrains-plugin-*
          path: release-assets
          merge-multiple: true

      - name: Download language server archives and checksums
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.lsp.outputs.archives-artifact }}
          path: release-assets

      - name: Assert release assets and version sync
        env:
          LSP_VERSION: ${{ needs.lsp.outputs.version }}
          CHECKSUMS_FILE: ${{ needs.lsp.outputs.checksums-file }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print | sort

          bun scripts/release/version.mjs "$VERSION" --check
          if [[ "$LSP_VERSION" != "$VERSION" ]]; then
            echo "build-lsp built $LSP_VERSION but the release is $VERSION" >&2
            exit 1
          fi

          require_count() {
            local expected=$1
            local pattern=$2
            local actual
            actual=$(find release-assets -type f -name "$pattern" | wc -l | tr -d ' ')
            if [[ "$actual" -ne "$expected" ]]; then
              echo "Expected $expected release assets matching $pattern, found $actual" >&2
              exit 1
            fi
          }

          lsp_targets=$(jq -r '.targets | length' scripts/package/targets.json)
          [[ "$lsp_targets" -eq 9 ]] || { echo "Expected 9 targets in targets.json, found $lsp_targets" >&2; exit 1; }
          require_count 9 'versionlens-redux-*-*.vsix'
          require_count 6 'versionlens-redux-neovim-plugin-*.tar.gz'
          require_count 1 'versionlens-redux-jetbrains-plugin-*.zip'
          require_count 1 "$CHECKSUMS_FILE"

          archives=$(find release-assets -maxdepth 1 -type f \( -name 'versionlens-lsp-*.tar.gz' -o -name 'versionlens-lsp-*.zip' \) | wc -l | tr -d ' ')
          if [[ "$archives" -ne "$lsp_targets" ]]; then
            echo "Expected $lsp_targets language server archives, found $archives" >&2
            exit 1
          fi
          for rust_target in $(jq -r '.targets[].rust' scripts/package/targets.json); do
            case "$rust_target" in
              *-windows-*) ext=zip ;;
              *) ext=tar.gz ;;
            esac
            file="versionlens-lsp-${VERSION}-${rust_target}.${ext}"
            [[ -f "release-assets/$file" ]] || { echo "Missing archive $file" >&2; exit 1; }
          done
          (cd release-assets && sha256sum --check --strict "$CHECKSUMS_FILE")
          test "$(wc -l < "release-assets/$CHECKSUMS_FILE" | tr -d ' ')" = "$lsp_targets"

      - name: Create GitHub tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mapfile -t assets < <(find release-assets -type f -print | sort)

          args=(
            "$tag"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$VERSION"
            --generate-notes
          )
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}" "${assets[@]}"
