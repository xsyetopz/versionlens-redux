name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Manifest checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated manifests
        run: |
          bun run check:manifests
          bun run check:manifest-baseline

  lsp:
    name: Build language server
    uses: ./.github/workflows/build-lsp.yml
    with:
      artifact-name: versionlens-lsp

  vscode:
    name: VS Code
    needs: lsp
    uses: ./.github/workflows/vscode.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}

  jetbrains:
    name: JetBrains
    needs: lsp
    uses: ./.github/workflows/jetbrains.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}

  neovim:
    name: Neovim
    needs: lsp
    uses: ./.github/workflows/neovim.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}

  zed:
    name: Zed
    uses: ./.github/workflows/zed.yml

  e2e:
    name: VS Code end-to-end
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Cargo registry and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum bun run test:e2e
