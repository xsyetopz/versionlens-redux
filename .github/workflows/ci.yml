name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lsp:
    name: Build language server
    uses: ./.github/workflows/build-lsp.yml
    with:
      artifact-name: versionlens-lsp

  vscode:
    name: VS Code
    needs: lsp
    uses: ./.github/workflows/vscode.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}

  jetbrains:
    name: JetBrains
    needs: lsp
    uses: ./.github/workflows/jetbrains.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}
      verify-ides: ${{ github.event_name != 'pull_request' }}

  neovim:
    name: Neovim
    needs: lsp
    uses: ./.github/workflows/neovim.yml
    with:
      lsp-artifact: ${{ needs.lsp.outputs.archives-artifact }}

  zed:
    name: Zed
    uses: ./.github/workflows/zed.yml
