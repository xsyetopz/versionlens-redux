name: JetBrains CI/CD

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      lsp-artifact:
        description: Artifact from an earlier build-lsp run. Empty builds the language server in this run.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lsp:
    name: Build language server
    if: ${{ !inputs.lsp-artifact }}
    uses: ./.github/workflows/build-lsp.yml

  package:
    name: JetBrains plugin
    needs: lsp
    if: ${{ !cancelled() && (needs.lsp.result == 'success' || needs.lsp.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download language server archives
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.lsp-artifact || 'versionlens-lsp' }}
          path: lsp-archives

      - name: Stage language server binaries for every target
        shell: bash
        run: |
          set -euo pipefail
          for rust_target in $(jq -r '.targets[].rust' scripts/package/targets.json); do
            bun scripts/package/stage-lsp.mjs lsp-archives "$rust_target" "packages/jetbrains-plugin/build/lsp-binaries/$rust_target"
          done

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: Check and build JetBrains plugin
        run: packages/jetbrains-plugin/gradlew -p packages/jetbrains-plugin check verifyPluginProjectConfiguration verifyPluginStructure buildPlugin --no-daemon --stacktrace

      - name: Verify JetBrains IDE compatibility
        run: packages/jetbrains-plugin/gradlew -p packages/jetbrains-plugin verifyPlugin --no-daemon --stacktrace

      - name: Name plugin archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(packages/jetbrains-plugin/build/distributions/*.zip)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "Expected one JetBrains plugin archive, found ${#artifacts[@]}" >&2
            exit 1
          fi
          version=$(basename -- "${artifacts[0]}" .zip)
          version=${version#versionlens-jetbrains-plugin-}
          mv -- "${artifacts[0]}" "packages/jetbrains-plugin/build/distributions/versionlens-redux-jetbrains-plugin-$version.zip"

      - name: Upload JetBrains artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: versionlens-redux-jetbrains-plugin
          path: packages/jetbrains-plugin/build/distributions/versionlens-redux-jetbrains-plugin-*.zip
          if-no-files-found: error
