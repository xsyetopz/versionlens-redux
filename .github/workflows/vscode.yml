name: VS Code CI/CD

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      lsp-artifact:
        description: Artifact from an earlier build-lsp run. Empty builds the language server in this run.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: VS Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: latest

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo registry and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vscode-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vscode-
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: |
          bun run check:biome
          bun run check:rustfmt

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run check:clippy
          cargo test --workspace --locked
          bun run test:extension
          bun run test:napi
          bun run check:extension-build

  lsp:
    name: Build language server
    if: ${{ !inputs.lsp-artifact }}
    uses: ./.github/workflows/build-lsp.yml

  targets:
    name: Resolve VS Code targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read target matrix
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(jq -c '{include: [.targets[] | {vscode_target: .vscode}]}' scripts/package/targets.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: VSIX (${{ matrix.vscode_target }})
    needs: [check, lsp, targets]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.lsp.result == 'success' || needs.lsp.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: latest

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download language server archives
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.lsp-artifact || 'versionlens-lsp' }}
          path: lsp-archives

      - name: Package target-specific VSIX
        shell: bash
        env:
          VSCODE_TARGET: ${{ matrix.vscode_target }}
        run: bun run package:vscode-target "$VSCODE_TARGET" lsp-archives

      - name: Upload target VSIX
        uses: actions/upload-artifact@v7.0.2
        with:
          name: versionlens-redux-vsix-${{ matrix.vscode_target }}
          path: packages/vscode-extension/*-${{ matrix.vscode_target }}.vsix
          if-no-files-found: error

  bundle:
    name: Bundle target VSIX packages
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download target packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: versionlens-redux-vsix-*
          path: packages
          merge-multiple: true

      - name: Require every VS Code target
        shell: bash
        run: |
          set -euo pipefail
          for target in $(jq -r '.targets[].vscode' scripts/package/targets.json); do
            compgen -G "packages/*-$target.vsix" >/dev/null || {
              echo "Missing VSIX for $target" >&2
              exit 1
            }
          done

      - name: Upload complete VSIX set
        uses: actions/upload-artifact@v7.0.2
        with:
          name: versionlens-redux-vsix
          path: packages/*.vsix
          if-no-files-found: error
