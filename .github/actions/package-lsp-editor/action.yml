name: Package LSP editor adapter
description: Stage the prebuilt build-lsp binary and package one editor target.

inputs:
  arch:
    description: Editor architecture name.
    required: true
  lsp-artifact:
    description: Artifact produced by build-lsp holding the archives and SHA256SUMS.
    required: true
  package-script:
    description: Repository-relative Bun packaging script.
    required: true
  platform:
    description: Editor platform name.
    required: true
  rust-target:
    description: Rust target triple of the prebuilt language server.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: ./.github/actions/setup-bun

    - name: Download language server archives
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.lsp-artifact }}
        path: lsp-archives

    - name: Stage language server binary
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.rust-target }}
      run: bun scripts/package/stage-lsp.mjs lsp-archives "$RUST_TARGET" "target/$RUST_TARGET/release"

    - name: Package editor adapter
      shell: bash
      env:
        EDITOR_ARCH: ${{ inputs.arch }}
        EDITOR_PLATFORM: ${{ inputs.platform }}
        PACKAGE_SCRIPT: ${{ inputs.package-script }}
        RUST_TARGET: ${{ inputs.rust-target }}
      run: bun "$PACKAGE_SCRIPT" "$EDITOR_PLATFORM" "$EDITOR_ARCH" "$RUST_TARGET"
