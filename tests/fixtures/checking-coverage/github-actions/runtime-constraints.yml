name: CI
jobs:
  build:
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20' # minimum stays declared
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.0" # compatible range stays declared
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '>=1.80' # minimum stays declared
