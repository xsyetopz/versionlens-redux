  "JavaScript",
  "JSON",
  "JSONC",
  "Kotlin",
  "Lua",
  "Nix",
  "OCaml",
  "Perl",
  "Plain Text",
  "Python",
  "Ruby",
  "Rust",
  "Scala",
  "Shell Script",
  "Starlark",
  "Swift",
  "Terraform",
  "TOML",
  "TSX",
  "TypeScript",
  "XML",
  "YAML",
  "Zig",
]
name = "VersionLens Redux Language Server"

