[package]
name = "versionlens-zed-extension"
version = "0.6.3"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = [
    "rust_backend",
] }
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
zed_extension_api = "0.7.0"
zip = { version = "9.4.1", default-features = false, features = [
    "deflate-flate2",
] }

[workspace]
